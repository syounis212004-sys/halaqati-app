version: 2.1

jobs:
  build_halaqati:
    docker:
      - image: cimg/android:2026.08
    resource_class: xlarge.gen2
    steps:
      - checkout

      - run:
          name: Verify and extract source
          command: |
            set -euo pipefail
            EXPECTED_SHA256="48896929ebafe053a2b959fa86169d639e8f5e52ec5f1b5f6e8ce2e020c14c08"
            ZIP_FILE="$(find "$PWD" -maxdepth 1 -type f -name "*.zip" | head -n 1)"
            test -n "$ZIP_FILE"
            ACTUAL_SHA256="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"
            test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
            rm -rf _native_build
            mkdir -p _native_build
            unzip -q "$ZIP_FILE" -d _native_build
            PROJECT_DIR="$PWD/_native_build/Halaqati_Native_Kotlin_v2.45.2"
            test -f "$PROJECT_DIR/settings.gradle.kts"
            test -f "$PROJECT_DIR/app/build.gradle.kts"
            echo "export PROJECT_DIR='$PROJECT_DIR'" >> "$BASH_ENV"

      - run:
          name: Prepare Android and Gradle
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            java -version
            free -h || true
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            test -n "$SDK_ROOT"
            echo "sdk.dir=$SDK_ROOT" > "$PROJECT_DIR/local.properties"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            cd "$PROJECT_DIR"
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
            chmod +x gradlew

      - run:
          name: Restore Firebase configuration
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd "$PROJECT_DIR"
            python3 - <<'PY'
            import base64, json, os
            from pathlib import Path
            b64 = os.environ.get("HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64", "").strip()
            raw = os.environ.get("HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
            target = Path("app/google-services.json")
            if b64:
                target.write_bytes(base64.b64decode(b64, validate=False))
            elif raw:
                target.write_text(raw, encoding="utf-8")
            else:
                raise SystemExit("Missing Firebase environment variable")
            data = json.loads(target.read_text(encoding="utf-8"))
            packages = [c.get("client_info",{}).get("android_client_info",{}).get("package_name") for c in data.get("client",[])]
            if "com.mohammedsamir.halaqati" not in packages:
                raise SystemExit(f"Firebase package mismatch: {packages}")
            PY

      - run:
          name: Configure Kotlin memory
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd "$PROJECT_DIR"
            python3 - <<'PY'
            from pathlib import Path
            updates = {
              "org.gradle.jvmargs": "-Xmx2048m -Xms256m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8",
              "kotlin.compiler.execution.strategy": "daemon",
              "kotlin.daemon.jvmargs": "-Xmx8192m -Xms512m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=384m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError",
              "kotlin.daemon.useFallbackStrategy": "false",
              "kotlin.incremental": "false",
              "org.gradle.parallel": "false",
              "org.gradle.workers.max": "1",
              "org.gradle.caching": "true",
              "org.gradle.vfs.watch": "false",
            }
            p=Path("gradle.properties")
            lines=p.read_text(encoding="utf-8").splitlines()
            out=[]; seen=set()
            for line in lines:
                s=line.strip()
                if "=" in s and not s.startswith("#"):
                    k=s.split("=",1)[0].strip()
                    if k in updates:
                        if k not in seen:
                            out.append(f"{k}={updates[k]}"); seen.add(k)
                        continue
                out.append(line)
            for k,v in updates.items():
                if k not in seen: out.append(f"{k}={v}")
            p.write_text("\n".join(out)+"\n", encoding="utf-8")
            PY

      - run:
          name: Build debug APK
          no_output_timeout: 40m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd "$PROJECT_DIR"
            ./gradlew --no-daemon --max-workers=1 --stacktrace :app:assembleDebug
            find app/build/outputs -type f -name "*.apk" -print

      - store_artifacts:
          path: _native_build/Halaqati_Native_Kotlin_v2.45.2/app/build/outputs/apk/debug
          destination: apk

workflows:
  halaqati:
    jobs:
      - build_halaqati
