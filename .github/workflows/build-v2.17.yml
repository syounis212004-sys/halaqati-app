name: Build Halaqati v2.17.3 Smart Plans + Official Capacitor Push + Offline Sync + Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Halaqati_Vite_Capacitor_v2_17_3_SMART_PLANS.zip"
      - ".github/workflows/build-halaqati-v2.17.3.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Halaqati v2.17.3 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./Halaqati_Vite_Capacitor_v2_17_3_SMART_PLANS.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f \
              -name 'Halaqati_Vite_Capacitor_v2_17_3_SMART_PLANS-*.zip' \
              -print | sort | head -n 1)"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Halaqati v2.17.3 project ZIP was not found in repository root"
            ls -la
            exit 1
          fi

          rm -rf extracted app
          mkdir -p extracted app
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE=""
          while IFS= read -r candidate; do
            if node -e '
              const fs=require("fs");
              const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              process.exit(
                p.name === "halaqati-official" &&
                p.scripts?.build &&
                p.scripts?.["prepare:offline"] ? 0 : 1
              );
            ' "$candidate"; then
              PACKAGE_FILE="$candidate"
              break
            fi
          done < <(find extracted -type f -name package.json -print)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Halaqati root package.json was not found inside ZIP"
            find extracted -maxdepth 4 -type f -name package.json -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          cp -a "$PROJECT_DIR"/. app/

          test -f app/index.html
          test -f app/package.json
          test -f app/capacitor.config.json
          test -f app/prebuilt-web/index.html
          test -f app/prebuilt-web/sw.js
          test -f app/prebuilt-web/core/supabase-2.min.js
          test -f app/prebuilt-web/core/quran-layout.js
          test -f app/src/main.js
          test -f app/src/core/offline-store.js
          test -f app/src/features/sessions/runtime.js
          test -f app/src/features/plans/runtime.js
          test -f app/src/features/notifications/push-bridge.js
          test -f app/scripts/configure-android-version.mjs
          test -f app/scripts/make-update-publish.mjs
          test -f app/scripts/v2173-check.mjs

          APP_VERSION="$(node -p "require('./app/package.json').version")"
          test "$APP_VERSION" = "2.17.3" || {
            echo "ERROR: expected v2.17.3, got $APP_VERSION"
            exit 1
          }

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building Halaqati v$APP_VERSION from $ZIP_FILE"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify official signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_B64:-}" || {
            echo "ERROR: Missing HALAQATI_KEYSTORE_BASE64"
            exit 1
          }
          test -n "${STORE_PASSWORD:-}" || {
            echo "ERROR: Missing HALAQATI_STORE_PASSWORD"
            exit 1
          }
          test -n "${KEY_ALIAS:-}" || {
            echo "ERROR: Missing HALAQATI_KEY_ALIAS"
            exit 1
          }
          test -n "${KEY_PASSWORD:-}" || {
            echo "ERROR: Missing HALAQATI_KEY_PASSWORD"
            exit 1
          }

          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

          keytool -list \
            -keystore halaqati-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          echo "Official Halaqati signing key verified ✅"

      - name: Validate Capacitor native plugins
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          UPDATER_DIR="plugins/halaqati-updater/android/src/main/java/com/mohammedsamir/halaqati/updater"
          UPDATER="$UPDATER_DIR/HalaqatiUpdaterPlugin.java"
          PROVIDER="$UPDATER_DIR/HalaqatiUpdateFileProvider.java"
          UPDATER_MANIFEST="plugins/halaqati-updater/android/src/main/AndroidManifest.xml"
          UPDATE_PATHS="plugins/halaqati-updater/android/src/main/res/xml/halaqati_update_paths.xml"

          DEEPLINK="plugins/halaqati-deeplink/android/src/main/java/com/mohammedsamir/halaqati/deeplink/HalaqatiDeepLinkPlugin.java"
          DEEPLINK_MANIFEST="plugins/halaqati-deeplink/android/src/main/AndroidManifest.xml"

          for f in \
            "$UPDATER" \
            "$PROVIDER" \
            "$UPDATER_MANIFEST" \
            "$UPDATE_PATHS" \
            "$DEEPLINK" \
            "$DEEPLINK_MANIFEST"; do
            test -s "$f" || {
              echo "ERROR: required native plugin file is missing: $f"
              exit 1
            }
          done

          ! grep -q 'executeOnThreadPool' "$UPDATER" || {
            echo "ERROR: old Capacitor API is still present"
            exit 1
          }

          grep -q 'new Thread(() ->' "$UPDATER" || {
            echo "ERROR: updater thread implementation is missing"
            exit 1
          }

          echo "Native plugins validated ✅"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Run v2.17.3 regression checks
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          npm run check:v2173
          npm run check:regression
          npm run check:data-integrity
          npm run check:offline-sync
          npm run check:offline-recovery
          npm run check:offline-queue
          npm run check:home-session-open
          npm run check:master-offline
          npm run check:notifications
          npm run check:push-safety
          npm run check:official-push
          npm run check:smart-plans
          npm run check:legacy

          node --check src/main.js
          node --check src/core/offline-store.js
          node --check src/features/sessions/runtime.js
          node --check src/features/plans/runtime.js
          node --check src/features/notifications/push-bridge.js

          echo "v2.17.3 regression checks passed ✅"

      - name: Detect Firebase Push configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ] || [ -n "${GOOGLE_SERVICES_B64:-}" ]; then
            echo "VITE_HALAQATI_FIREBASE_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Firebase Push configuration detected ✅"
          else
            echo "VITE_HALAQATI_FIREBASE_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::warning::Firebase config is absent. APK will build, but Push registration will remain disabled."
          fi

      - name: Build v2.17.3 web
        working-directory: app
        run: npm run build

      - name: Verify v2.17.3 web build
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/index.html
          test -s dist/404.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/core/supabase-2.min.js
          test -s dist/core/quran-layout.js
          test -s dist/core/fonts/amiri-search.ttf
          test -s dist/vendor/xlsx-0.18.5.min.js

          grep -q '2.17.3' dist/index.html
          grep -q 'QCF4 Hafs' dist/core/quran-layout.js

          grep -q 'uploadSession' dist/assets/runtime-B0-VaPeX.js
          grep -q 'reopenSession' dist/assets/runtime-B0-VaPeX.js
          grep -q 'editSessionData' dist/assets/runtime-B0-VaPeX.js
          grep -q 'normalizeQuranNumberInput' dist/assets/app-D-XWWbw8.js
          grep -q 'homeSelectedMonthKey' dist/assets/runtime-JqlIvufQ.js

          echo "v2.17.3 web features verified ✅"

      - name: Create web release ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Halaqati-v${APP_VERSION}-web.zip"
          (
            cd app/dist
            zip -q -9 -r "../../Halaqati-v${APP_VERSION}-web.zip" .
          )
          test -s "Halaqati-v${APP_VERSION}-web.zip"
          unzip -t "Halaqati-v${APP_VERSION}-web.zip"

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Pin Firebase Messaging for official Capacitor Push
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()

          if "firebaseMessagingVersion" in s:
              s = re.sub(
                  r"firebaseMessagingVersion\s*=\s*['\"][^'\"]+['\"]",
                  "firebaseMessagingVersion = '25.1.1'",
                  s
              )
          else:
              marker = "ext {"
              if marker not in s:
                  raise SystemExit("variables.gradle does not contain ext block")
              s = s.replace(
                  marker,
                  marker + "\n    firebaseMessagingVersion = '25.1.1'",
                  1
              )

          p.write_text(s)
          PY

          grep -q "firebaseMessagingVersion = '25.1.1'" android/variables.gradle

      - name: Install Firebase Android configuration
        if: env.VITE_HALAQATI_FIREBASE_CONFIGURED == 'true'
        working-directory: app
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          rm -f android/app/google-services.json

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          fi

          test -s android/app/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("android/app/google-services.json").read_text())
          packages = [
              c.get("client_info", {})
               .get("android_client_info", {})
               .get("package_name")
              for c in d.get("client", [])
          ]

          assert "com.mohammedsamir.halaqati" in packages, packages
          print("Firebase Android package validated ✅")
          PY

      - name: Ensure Android notification permission
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"

          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = "<application"

          if marker not in s:
              raise SystemExit("Android application tag missing")

          s = s.replace(
              marker,
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    ' + marker,
              1
          )
          p.write_text(s)
          PY
          fi

          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"

      - name: Sync Capacitor Android
        working-directory: app
        run: npx cap sync android

      - name: Verify official Capacitor Push plugin
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          test -d node_modules/@capacitor/push-notifications
          test -s node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java

          grep -q '@capacitor/push-notifications' package.json

          if ! grep -R -q \
            "capacitor-push-notifications\|@capacitor/push-notifications" \
            android/capacitor.settings.gradle \
            android/settings.gradle \
            android/app/capacitor.build.gradle 2>/dev/null; then
            echo "ERROR: official Capacitor Push plugin was not linked"
            exit 1
          fi

          echo "Official Capacitor Push linked ✅"

      - name: Set Android version 2.17.3
        working-directory: app
        run: node scripts/configure-android-version.mjs

      - name: Build release APK
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign official release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" \
            -p -f 4 \
            "$UNSIGNED" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "Halaqati-v${APP_VERSION}.apk"

      - name: Validate final APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/aapt" dump badging \
            "Halaqati-v${APP_VERSION}.apk" \
            | head -n 5 \
            | tee /tmp/halaqati-badging.txt

          grep -q "package: name='com.mohammedsamir.halaqati'" /tmp/halaqati-badging.txt
          grep -q "versionCode='21703'" /tmp/halaqati-badging.txt
          grep -q "versionName='2.17.3'" /tmp/halaqati-badging.txt

          test -s "Halaqati-v${APP_VERSION}.apk"

          echo "Final APK v2.17.3 validated ✅"

      - name: Create update publish package
        working-directory: app
        run: node scripts/make-update-publish.mjs "../Halaqati-v${APP_VERSION}.apk"

      - name: Verify publish update package
        shell: bash
        run: |
          set -euo pipefail

          test -s "app/Halaqati-v${APP_VERSION}-publish-update.zip"
          test -s app/update-publish/version.json
          test -s app/update-publish/Halaqati-latest.apk

          unzip -t "app/Halaqati-v${APP_VERSION}-publish-update.zip"

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path("app/update-publish/version.json").read_text())
          assert d["versionName"] == "2.17.3"
          assert d["versionCode"] == 21703
          assert d["apkUrl"].endswith("/Halaqati-latest.apk")
          print("Update manifest v2.17.3 verified ✅")
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload web ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-web
          path: Halaqati-v${{ env.APP_VERSION }}-web.zip
          if-no-files-found: error

      - name: Upload publish-update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: app/Halaqati-v${{ env.APP_VERSION }}-publish-update.zip
          if-no-files-found: error
