name: Build Halaqati Native v2.45.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/Halaqati_Native_Kotlin_v2_45_2*.zip'
      - '.github/workflows/build-halaqati-native-v2.45.2*.yml'

permissions:
  contents: read

env:
  EXPECTED_ARCHIVE_SHA256: '48896929ebafe053a2b959fa86169d639e8f5e52ec5f1b5f6e8ce2e020c14c08'
  PROJECT_DIR: Halaqati_Native_Kotlin_v2.45.2
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  verify-build:
    # Private-repo ubuntu-latest has 8 GB RAM; macos-15-intel provides 14 GB.
    # This build uses the extra memory only to get the frozen release candidate
    # through the real Kotlin/Compose compiler and Android release gates.
    runs-on: macos-15-intel
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Locate, verify and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil, zipfile

          expected = os.environ["EXPECTED_ARCHIVE_SHA256"].lower()
          project = os.environ["PROJECT_DIR"]

          candidates = sorted(
              p for p in Path(".").rglob("Halaqati_Native_Kotlin_v2_45_2*.zip")
              if ".git" not in p.parts
          )

          if not candidates:
              print("::error::No Halaqati_Native_Kotlin_v2_45_2*.zip was found in the checked-out repository.")
              print("Repository files:")
              for p in sorted(x for x in Path(".").rglob("*") if x.is_file() and ".git" not in x.parts):
                  print(p)
              raise SystemExit(1)

          archive = None
          print("ZIP candidates:")
          for p in candidates:
              sha = hashlib.sha256(p.read_bytes()).hexdigest()
              size = p.stat().st_size
              print(f"  {p} | {size} bytes | SHA-256={sha}")
              if sha == expected:
                  archive = p
                  break

          if archive is None:
              print(f"::error::A ZIP candidate was found, but none matches frozen SHA-256 {expected}.")
              raise SystemExit(1)

          if archive.stat().st_size == 0:
              print(f"::error::Source archive is empty: {archive}")
              raise SystemExit(1)

          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  print(f"::error::Corrupt ZIP member: {bad}")
                  raise SystemExit(1)

              lowered = [n.lower() for n in zf.namelist()]
              forbidden = [
                  n for n in lowered
                  if n.endswith("google-services.json")
                  or n.endswith("local.properties")
                  or n.endswith(".jks")
                  or n.endswith(".keystore")
              ]
              if forbidden:
                  print("::error::Archive contains a forbidden secret/local file.")
                  for n in forbidden:
                      print(n)
                  raise SystemExit(1)

              dest = Path("_native_build")
              if dest.exists():
                  shutil.rmtree(dest)
              dest.mkdir()
              zf.extractall(dest)

          root = Path("_native_build") / project
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "gradle.properties"):
              if not (root / required).is_file():
                  print(f"::error::{required} not found under expected project directory {project}")
                  raise SystemExit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ARCHIVE={archive}\n")

          print(f"Using verified archive: {archive}")
          print("Archive integrity and project layout OK.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Restore Firebase config
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        env:
          FIREBASE_JSON_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          b64 = os.environ.get("FIREBASE_JSON_B64", "")
          raw = os.environ.get("FIREBASE_JSON", "")
          target = Path("app/google-services.json")

          if b64:
              try:
                  target.write_bytes(base64.b64decode(b64, validate=False))
              except Exception as exc:
                  print(f"::error::Unable to decode Firebase base64 secret: {exc}")
                  raise SystemExit(1)
          elif raw:
              target.write_text(raw, encoding="utf-8")
          else:
              print("::error::Missing Firebase google-services secret")
              raise SystemExit(1)

          data = json.loads(target.read_text(encoding="utf-8"))
          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          ]
          if "com.mohammedsamir.halaqati" not in packages:
              print(f"::error::Firebase package mismatch: {packages}")
              raise SystemExit(1)
          print("Firebase package contract OK")
          PY

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          value = os.environ.get("KEYSTORE_B64", "")
          if not value:
              print("::error::Missing HALAQATI_KEYSTORE_BASE64")
              raise SystemExit(1)

          path = Path(os.environ["RUNNER_TEMP"]) / "halaqati-release.jks"
          path.write_bytes(base64.b64decode(value, validate=False))
          if not path.is_file() or path.stat().st_size == 0:
              print("::error::Decoded keystore is empty")
              raise SystemExit(1)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"HALAQATI_KEYSTORE_PATH={path}\n")
          print("Release keystore restored.")
          PY

      - name: Align Kotlin compiler with AGP in extracted CI copy
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          # The frozen ZIP remains untouched. Only the ephemeral extracted copy on
          # this GitHub runner is adjusted to a JetBrains-supported KGP/AGP matrix.
          ROOT_BUILD="build.gradle.kts"
          BEFORE_SHA="$(shasum -a 256 "$ROOT_BUILD" | awk '{print $1}')"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          expected_android = 'id("com.android.application") version "8.13.2" apply false'
          old_kotlin = 'id("org.jetbrains.kotlin.android") version "2.2.21" apply false'
          old_compose = 'id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false'

          if expected_android not in s:
              raise SystemExit("::error::Expected AGP 8.13.2 declaration not found; refusing blind CI patch.")
          if old_kotlin not in s or old_compose not in s:
              raise SystemExit("::error::Expected Kotlin/Compose 2.2.21 declarations not found; refusing blind CI patch.")

          s = s.replace(
              old_kotlin,
              'id("org.jetbrains.kotlin.android") version "2.4.20" apply false'
          )
          s = s.replace(
              old_compose,
              'id("org.jetbrains.kotlin.plugin.compose") version "2.4.20" apply false'
          )

          p.write_text(s, encoding="utf-8")
          PY

          AFTER_SHA="$(shasum -a 256 "$ROOT_BUILD" | awk '{print $1}')"

          echo "Frozen source ZIP SHA-256 remains:"
          shasum -a 256 "$GITHUB_WORKSPACE/$ARCHIVE"
          echo
          echo "Ephemeral root build script:"
          echo "  before: $BEFORE_SHA"
          echo "  after:  $AFTER_SHA"
          echo
          grep -E 'com.android.application|org.jetbrains.kotlin.android|org.jetbrains.kotlin.plugin.compose' "$ROOT_BUILD"

          grep -q 'id("com.android.application") version "8.13.2"' "$ROOT_BUILD"
          grep -q 'id("org.jetbrains.kotlin.android") version "2.4.20"' "$ROOT_BUILD"
          grep -q 'id("org.jetbrains.kotlin.plugin.compose") version "2.4.20"' "$ROOT_BUILD"

          echo "Supported compiler matrix applied only to extracted CI copy."

      - name: Configure CI-only Kotlin and Gradle performance profile
        shell: bash
        run: |
          set -euo pipefail

          CI_GRADLE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$CI_GRADLE_HOME"

          # IMPORTANT:
          # These overrides live only in the ephemeral GitHub runner.
          # Nothing inside the frozen source ZIP/project is modified.
          cat > "$CI_GRADLE_HOME/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=true
          org.gradle.vfs.watch=false

          kotlin.compiler.execution.strategy=daemon
          kotlin.daemon.jvmargs=-Xmx8192m -Xms1024m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=320m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
          kotlin.daemon.useFallbackStrategy=false
          kotlin.incremental=true

          kotlin.build.report.output=file,json
          kotlin.build.report.file.output_dir=build/reports/kotlin-build
          kotlin.build.report.json.directory=build/reports/kotlin-build-json
          EOF

          echo "CI-only Gradle properties:"
          cat "$CI_GRADLE_HOME/gradle.properties"

          echo
          echo "Frozen project gradle.properties remains unchanged:"
          shasum -a 256 "_native_build/$PROJECT_DIR/gradle.properties"

      - name: Static release-freeze checks
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compile-sanity-check.py
          python3 scripts/compose-risk-check.py
          python3 scripts/static-parity-check.py
          python3 scripts/uiux-pro-max-check.py
          python3 scripts/navigation-contract-check.py
          python3 scripts/release-contract-check.py
          python3 scripts/auth-push-privacy-check.py
          python3 scripts/smart-plan-alerts-check.py
          python3 scripts/offline-account-scope-check.py
          python3 scripts/local-sensitive-account-scope-check.py
          python3 scripts/manifest-contract-check.py
          if command -v kotlinc >/dev/null 2>&1; then
            bash scripts/run-kotlin-selftests.sh
          else
            echo 'kotlinc unavailable; Gradle unit tests remain mandatory'
          fi

      - name: CI memory and compiler diagnostics
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Runner ==="
          uname -a
          echo "=== Physical RAM ==="
          python3 - <<'PY'
          import subprocess
          raw = subprocess.check_output(["sysctl", "-n", "hw.memsize"], text=True).strip()
          print(f"{int(raw) / 1024**3:.2f} GiB")
          PY
          echo "=== VM statistics ==="
          vm_stat
          echo "=== Frozen project properties (not modified) ==="
          cat gradle.properties
          echo "=== CI-only user Gradle properties (higher precedence) ==="
          cat "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
          echo "=== Gradle ==="
          gradle --version

      - name: Verify effective Kotlin compiler before compile
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Effective plugin declarations ==="
          grep -E 'com.android.application|org.jetbrains.kotlin.android|org.jetbrains.kotlin.plugin.compose' build.gradle.kts
          echo
          echo "=== Gradle/Kotlin plugin resolution ==="
          gradle --build-cache --max-workers=2 --info help 2>&1 \
            | tee /tmp/halaqati-gradle-info.txt
          grep -E 'Using Kotlin Gradle plugin|kotlin-gradle-plugin|Kotlin version' /tmp/halaqati-gradle-info.txt \
            | tail -30 || true

      - name: Compile debug Kotlin
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          heartbeat() {
            while true; do
              sleep 60
              echo
              echo "===== Kotlin compiler heartbeat $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
              ps -Ao pid,ppid,%cpu,%mem,rss,vsz,etime,command \
                | grep -E 'GradleDaemon|KotlinCompileDaemon|org.gradle.launcher' \
                | grep -v grep \
                | head -20 || true
              echo "------------------------------------------------------------"
            done
          }

          heartbeat &
          HEARTBEAT_PID=$!
          cleanup() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
            wait "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          /usr/bin/time -l gradle \
            --build-cache \
            --max-workers=2 \
            --stacktrace \
            :app:compileDebugKotlin

      - name: Compile release Kotlin
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          heartbeat() {
            while true; do
              sleep 60
              echo
              echo "===== Kotlin release compiler heartbeat $(date -u '+%Y-%m-%dT%H:%M:%SZ') ====="
              ps -Ao pid,ppid,%cpu,%mem,rss,vsz,etime,command \
                | grep -E 'GradleDaemon|KotlinCompileDaemon|org.gradle.launcher' \
                | grep -v grep \
                | head -20 || true
              echo "--------------------------------------------------------------------"
            done
          }

          heartbeat &
          HEARTBEAT_PID=$!
          cleanup() {
            kill "$HEARTBEAT_PID" 2>/dev/null || true
            wait "$HEARTBEAT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          /usr/bin/time -l gradle \
            --build-cache \
            --max-workers=2 \
            --stacktrace \
            :app:compileReleaseKotlin

      - name: Unit tests
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --max-workers=2 --stacktrace :app:testDebugUnitTest

      - name: Release lint
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --build-cache --max-workers=2 --stacktrace :app:lintRelease

      - name: Assemble signed release APK
        working-directory: _native_build/${{ env.PROJECT_DIR }}
        shell: bash
        env:
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --build-cache --max-workers=2 --stacktrace :app:assembleRelease

      - name: Verify APK identity and exact signing certificate
        shell: bash
        env:
          EXPECTED_CERT: ${{ secrets.HALAQATI_EXPECTED_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ROOT="_native_build/$PROJECT_DIR"
          APK="$(find "$ROOT/app/build/outputs/apk/release" -name '*.apk' -type f | head -1)"
          test -n "$APK" && test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$AAPT" dump badging "$APK" | tee aapt-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee aapt-manifest.txt

          grep -q "package: name='com.mohammedsamir.halaqati' versionCode='24502' versionName='2.45.2'" aapt-badging.txt
          grep -q "sdkVersion:'23'" aapt-badging.txt
          grep -q "targetSdkVersion:'36'" aapt-badging.txt
          grep -q 'halaqati_general' aapt-manifest.txt
          grep -q 'com.google.firebase.messaging.default_notification_channel_id' aapt-manifest.txt
          grep -q 'com.google.firebase.messaging.default_notification_icon' aapt-manifest.txt
          grep -q 'com.mohammedsamir.halaqati' aapt-manifest.txt

          test -n "${EXPECTED_CERT:-}" || {
            echo 'Missing HALAQATI_EXPECTED_SIGNING_CERT_SHA256' >&2
            exit 1
          }

          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt | head -1 | tr '[:lower:]' '[:upper:]' | tr -d ': ')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr '[:lower:]' '[:upper:]' | tr -d ': ')"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "Signing certificate mismatch: $ACTUAL" >&2
            exit 1
          }

          unzip -l "$APK" | grep -q 'classes.dex'
          cp "$APK" Halaqati-v2.45.2-release.apk

          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("Halaqati-v2.45.2-release.apk")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          Path("Halaqati-v2.45.2-release.apk.sha256").write_text(
              f"{digest}  {p.name}\n", encoding="utf-8"
          )
          print(f"APK SHA-256: {digest}")
          PY

      - name: Build CI audit report
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '# Halaqati Native v2.45.2 CI audit'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Runner OS: $RUNNER_OS"
            echo "Runner architecture: $RUNNER_ARCH"
            echo
            echo 'Required gates: archive integrity, static contracts, debug/release Kotlin compilation, unit tests, lint, signed release assembly, APK identity, exact signing certificate.'
            [ -f apksigner.txt ] && { echo; echo '## apksigner'; cat apksigner.txt; }
            [ -f aapt-badging.txt ] && { echo; echo '## aapt badging'; cat aapt-badging.txt; }
            [ -f aapt-manifest.txt ] && { echo; echo '## aapt manifest'; cat aapt-manifest.txt; }
          } > Halaqati-v2.45.2-CI-AUDIT.md
          exit 0

      - name: Upload Kotlin build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v2.45.2-kotlin-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            _native_build/Halaqati_Native_Kotlin_v2.45.2/build/reports/kotlin-build/**
            _native_build/Halaqati_Native_Kotlin_v2.45.2/build/reports/kotlin-build-json/**
            _native_build/Halaqati_Native_Kotlin_v2.45.2/app/build/reports/kotlin-build/**
            _native_build/Halaqati_Native_Kotlin_v2.45.2/app/build/reports/kotlin-build-json/**

      - name: Upload verified artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-Native-v2.45.2-verified
          if-no-files-found: error
          retention-days: 30
          path: |
            Halaqati-v2.45.2-release.apk
            Halaqati-v2.45.2-release.apk.sha256
            Halaqati-v2.45.2-CI-AUDIT.md
            _native_build/Halaqati_Native_Kotlin_v2.45.2/app/build/reports/tests/testDebugUnitTest/**
            _native_build/Halaqati_Native_Kotlin_v2.45.2/app/build/reports/lint-results-release.html
