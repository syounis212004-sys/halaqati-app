name: Mushaf rendering validation
on:
  push:
    branches: [fix/android-mushaf-mark-rendering]
    paths: ['source/**', '.github/workflows/mushaf-regression-validation.yml']
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: false
          cache-cleanup: always
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install SDK and prepare verified test assets
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/madina.json" https://digitalkhatt.org/assets/layouts/madina.json
          echo "5de6e0c60d8a402b37483fed4f799eeefaebd5edd94b67ff1ac8d8e9ba5ff358  $RUNNER_TEMP/madina.json" | sha256sum -c -
          python3 -I source/scripts/dk/make_dk_assets.py "$RUNNER_TEMP/madina.json" source/app/src/main/assets/dk
          python3 -I source/scripts/dk/verify_pack.py source/app/src/main/assets/dk
      - name: Generate an offline-only Firebase resource fixture
        run: |
          cat > source/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"halaqati-rendering-test"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890abcdef","android_client_info":{"package_name":"com.mohammedsamir.halaqati"}},"api_key":[{"current_key":"offline-fixture"}]}],"configuration_version":"1"}
          JSON
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-15-robolectric-12650502-i7
      - name: Cache Android runtime for Robolectric
        run: |
          runtime=15-robolectric-12650502-i7
          jar=android-all-instrumented-$runtime.jar
          base=org/robolectric/android-all-instrumented/$runtime
          dir="$HOME/.m2/repository/$base"
          mkdir -p "$dir"
          if [ ! -s "$dir/$jar" ]; then
            curl -fsSL --retry 3 "https://repo.maven.apache.org/maven2/$base/$jar" -o "$dir/$jar.part"
            mv "$dir/$jar.part" "$dir/$jar"
          fi
      - name: Run focused Android checks
        working-directory: source
        run: >
          gradle --no-daemon --console=plain :app:testDebugUnitTest
          --tests '*MushafEngineTest'
          --tests '*SafetyScoringTest'
          --tests '*DkBitmapsTest'
          --tests '*DkRenderCostTest'
          --tests '*DkHitAccuracyTest'
          --tests '*DkPagePreviewTest.pinchZoomShowsTheResetButtonAndFreezesPageSwipeUntilReset'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mushaf-test-results
          path: |
            source/app/build/test-results/testDebugUnitTest/
            source/app/build/mushaf-mark-regression/
