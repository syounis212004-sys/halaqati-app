name: Halaqati web and native Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install web dependencies
        run: npm ci
      - name: Verify pinned Hafs metadata
        run: |
          tmp_meta="$(mktemp)"
          node native-android/verification/generate-quran-metadata.mjs "$tmp_meta"
          cmp "$tmp_meta" native-android/app/src/main/java/com/mohammedsamir/halaqati/nativeapp/QuranMetadata.kt
      - name: Verify unchanged web file baseline
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          expected = json.loads((root / 'native-android/verification/baseline-sha256.json').read_text())
          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'web baseline mismatch: {name}')
          print(f'web baseline OK ({len(expected)} files)')
          PY
      - name: Check unchanged web contracts
        run: |
          npm run check:legacy
          npm run check:v2420
          npm run check:v2430
          npm run check:v2440
      - name: Build unchanged web/PWA application
        run: npm run build

      - name: Run native unit tests, lint, and debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Build native release artifacts
        working-directory: native-android
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify artifacts
        run: |
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          test -s native-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s native-android/app/build/outputs/bundle/release/app-release.aab

      - name: Package source and reports
        run: |
          mkdir -p artifacts
          cp native-android/app/build/outputs/apk/debug/app-debug.apk artifacts/halaqati-native-debug.apk
          cp native-android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/halaqati-native-release-unsigned.apk
          cp native-android/app/build/outputs/bundle/release/app-release.aab artifacts/halaqati-native-release-unsigned.aab
          zip -r artifacts/Halaqati-Native-v2.44.0-source.zip . \
            -x './node_modules/*' './dist/*' './native-android/.gradle/*' './native-android/.kotlin/*' './native-android/app/build/*' './artifacts/*' './.git/*'

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: halaqati-native-v2.44.0
          path: artifacts/
