name: Build Signed Halaqati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract correct Halaqati project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted app
          mkdir -p extracted app

          FOUND=""

          for ZIP_FILE in ./*.zip; do
            [ -f "$ZIP_FILE" ] || continue

            echo "Checking ZIP: $ZIP_FILE"

            TRY_DIR="extracted/try"
            rm -rf "$TRY_DIR"
            mkdir -p "$TRY_DIR"
            unzip -q "$ZIP_FILE" -d "$TRY_DIR"

            # Find a capacitor.config.json/ts and verify that package.json
            # in the SAME directory is the app's root package.json.
            while IFS= read -r CAP_FILE; do
              PROJECT_DIR="$(dirname "$CAP_FILE")"
              PACKAGE_FILE="$PROJECT_DIR/package.json"

              [ -f "$PACKAGE_FILE" ] || continue
              [ -f "$PROJECT_DIR/source/index.html" ] || continue
              [ -f "$PROJECT_DIR/scripts/prepare-offline.mjs" ] || continue

              if node - "$PACKAGE_FILE" <<'NODE'
const fs = require('fs');
const file = process.argv[2];
const p = JSON.parse(fs.readFileSync(file, 'utf8'));

if (!p?.scripts?.['prepare:offline']) process.exit(1);
if (!p?.dependencies?.['@capacitor/android']) process.exit(1);
if (!p?.dependencies?.['@capacitor/core']) process.exit(1);

console.log(`Verified root package.json: ${file}`);
console.log(`Version: ${p.version}`);
console.log(`prepare:offline: ${p.scripts['prepare:offline']}`);
NODE
              then
                echo "Correct Halaqati project found."
                echo "ZIP: $ZIP_FILE"
                echo "Project directory: $PROJECT_DIR"

                cp -a "$PROJECT_DIR"/. app/
                FOUND="yes"
                break 2
              fi
            done < <(find "$TRY_DIR" -type f \( -name capacitor.config.json -o -name capacitor.config.ts \))
          done

          if [ "$FOUND" != "yes" ]; then
            echo "ERROR: Could not find the Halaqati Capacitor project."
            echo ""
            echo "ZIP files found:"
            ls -lh ./*.zip 2>/dev/null || true
            echo ""
            echo "Expected root files inside the ZIP:"
            echo "  package.json"
            echo "  capacitor.config.json"
            echo "  source/index.html"
            echo "  scripts/prepare-offline.mjs"
            exit 1
          fi

          APP_VERSION="$(node -p "require('./app/package.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "Selected app package.json:"
          cat app/package.json

          echo ""
          echo "Selected project files:"
          ls -la app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || (echo "Missing HALAQATI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing HALAQATI_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing HALAQATI_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing HALAQATI_KEY_PASSWORD" && exit 1)

          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify project scripts
        working-directory: app
        run: |
          npm run
          node - <<'NODE'
const p = require('./package.json');
if (!p.scripts?.['prepare:offline']) {
  throw new Error('prepare:offline script is missing');
}
console.log('prepare:offline is available:', p.scripts['prepare:offline']);
NODE

      - name: Prepare offline files
        working-directory: app
        run: npm run prepare:offline

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Set Android version
        working-directory: app
        run: node scripts/configure-android-version.mjs

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned release APK not found."
            find app/android/app/build/outputs -type f || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$UNSIGNED" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "Halaqati-v${APP_VERSION}.apk"

          test -s "Halaqati-v${APP_VERSION}.apk"

      - name: Create update publish package
        working-directory: app
        run: |
          node scripts/make-update-publish.mjs "../Halaqati-v${APP_VERSION}.apk"

          echo "Update files:"
          ls -lh update-publish

          test -s update-publish/Halaqati-latest.apk
          test -s update-publish/version.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload update files
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: |
            app/update-publish/version.json
            app/update-publish/Halaqati-latest.apk
          if-no-files-found: error
