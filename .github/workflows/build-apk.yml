name: Build Signed Halaqati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract Halaqati project
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: use the Android/Capacitor ZIP only, not the PWA ZIP.
          ZIP_FILE="./Halaqati_Offline_Capacitor_v2_10_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in repository root"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          rm -rf extracted app
          mkdir -p extracted app
          unzip -q "$ZIP_FILE" -d extracted

          # There are multiple package.json files inside the ZIP (main app + local plugins).
          # Select ONLY the package.json that actually contains the prepare:offline script.
          PACKAGE_FILE=""
          while IFS= read -r candidate; do
            if node -e '
              const fs = require("fs");
              const p = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(p.scripts && p.scripts["prepare:offline"] ? 0 : 1);
            ' "$candidate"; then
              PACKAGE_FILE="$candidate"
              break
            fi
          done < <(find extracted -type f -name package.json -print)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: Could not find the main Halaqati package.json with prepare:offline"
            echo "package.json files found:"
            find extracted -type f -name package.json -print
            exit 1
          fi

          echo "Main package.json: $PACKAGE_FILE"
          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          cp -a "$PROJECT_DIR"/. app/

          # Validate that we copied the real application root.
          test -f app/package.json
          test -f app/scripts/prepare-offline.mjs
          test -f app/source/index.html
          test -f app/capacitor.config.json

          node -e '
            const p = require("./app/package.json");
            if (!p.scripts || !p.scripts["prepare:offline"]) {
              throw new Error("prepare:offline script is missing from copied app/package.json");
            }
            console.log("prepare:offline =", p.scripts["prepare:offline"]);
          '

          APP_VERSION="$(node -p "require('./app/package.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building Halaqati v$APP_VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || (echo "Missing HALAQATI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing HALAQATI_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing HALAQATI_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing HALAQATI_KEY_PASSWORD" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

      - name: Fix Capacitor 8 updater plugin
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          JAVA_DIR="plugins/halaqati-updater/android/src/main/java/com/mohammedsamir/halaqati/updater"
          FILE="$JAVA_DIR/HalaqatiUpdaterPlugin.java"
          PROVIDER_FILE="$JAVA_DIR/HalaqatiUpdateFileProvider.java"
          MANIFEST="plugins/halaqati-updater/android/src/main/AndroidManifest.xml"

          test -f "$FILE"
          test -f "$MANIFEST"

          # Fix 1: Capacitor 8 no longer exposes Bridge.executeOnThreadPool().
          # Use a normal background Java thread for the APK download instead.
          sed -i 's/getBridge().executeOnThreadPool(() -> {/new Thread(() -> {/' "$FILE"
          sed -i 's/^        });$/        }).start();/' "$FILE"

          if grep -q 'executeOnThreadPool' "$FILE"; then
            echo "ERROR: old Capacitor API is still present"
            exit 1
          fi

          # Fix 2: do NOT register a second androidx.core.content.FileProvider directly.
          # Capacitor's app manifest already has a FileProvider with its own FILE_PROVIDER_PATHS.
          # Android's manifest merger otherwise merges both providers and the android:resource
          # values conflict. Register a tiny dedicated subclass for the updater instead.
          cat > "$PROVIDER_FILE" <<'EOF'
          package com.mohammedsamir.halaqati.updater;

          import androidx.core.content.FileProvider;

          public class HalaqatiUpdateFileProvider extends FileProvider {
          }
          EOF

          sed -i 's#android:name="androidx.core.content.FileProvider"#android:name="com.mohammedsamir.halaqati.updater.HalaqatiUpdateFileProvider"#' "$MANIFEST"

          if grep -q 'android:name="androidx.core.content.FileProvider"' "$MANIFEST"; then
            echo "ERROR: updater manifest still uses the shared FileProvider class"
            exit 1
          fi

          echo "Updater Java thread fix:"
          grep -nE 'new Thread|executeOnThreadPool|\.start\(\)' "$FILE"
          echo "Updater provider manifest:"
          cat "$MANIFEST"
          echo "Updater provider class:"
          cat "$PROVIDER_FILE"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify npm scripts
        working-directory: app
        run: |
          node -p "require('./package.json').name"
          node -p "require('./package.json').version"
          npm run

      - name: Prepare offline files
        working-directory: app
        run: npm run prepare:offline

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Set Android version
        working-directory: app
        run: |
          set -e
          APP_VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a=0,b=0,c=0]=process.argv[1].split('.').map(Number); console.log(a*10000+b*100+c)" "$APP_VERSION")"
          GRADLE="android/app/build.gradle"

          echo "Setting Android version to $APP_VERSION ($VERSION_CODE)"
          test -f "$GRADLE"

          sed -E -i "s/versionCode[[:space:]]+[0-9]+/versionCode $VERSION_CODE/" "$GRADLE"
          sed -E -i "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$APP_VERSION\"/" "$GRADLE"

          grep -nE 'versionCode|versionName' "$GRADLE"

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned release APK not found"
            find app/android/app/build/outputs -type f || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "Halaqati-v${APP_VERSION}.apk"
          test -s "Halaqati-v${APP_VERSION}.apk"

      - name: Create update publish package
        run: |
          set -e
          mkdir -p app/update-publish
          cp "Halaqati-v${APP_VERSION}.apk" app/update-publish/Halaqati-latest.apk

          VERSION_CODE="$(node -e "const [a=0,b=0,c=0]=process.argv[1].split('.').map(Number); console.log(a*10000+b*100+c)" "$APP_VERSION")"

          cat > app/update-publish/version.json <<EOF
          {
            "versionName": "${APP_VERSION}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://syounis212004-sys.github.io/halaqati-web/Halaqati-latest.apk",
            "mandatory": false,
            "notes": [
              "استعادة واجهة وتقارير وإدارة التحديثات الخاصة بسلسلة 2.8 مع تحسين العمل دون إنترنت.",
              "حساب صفحات القرآن بدقة من بيانات مصحف المدينة QCF4 المضمّنة.",
              "دعم تعدد المشرفين لكل حلقة مع الحفاظ على التوقيع والتحديث المباشر."
            ]
          }
          EOF

          cat app/update-publish/version.json
          test -s app/update-publish/Halaqati-latest.apk
          test -s app/update-publish/version.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload update files
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: |
            app/update-publish/version.json
            app/update-publish/Halaqati-latest.apk
          if-no-files-found: error
