name: Build Signed Halaqati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract correct Halaqati project
        run: |
          set -e

          rm -rf extracted app
          mkdir -p extracted app

          FOUND=""

          # Try every ZIP in the repository root.
          # We only accept a project whose ROOT package.json contains
          # the prepare:offline script. This prevents GitHub from accidentally
          # selecting package.json from a Capacitor plugin.
          for ZIP_FILE in ./*.zip; do
            [ -f "$ZIP_FILE" ] || continue

            echo "Checking ZIP: $ZIP_FILE"

            TRY_DIR="extracted/try"
            rm -rf "$TRY_DIR"
            mkdir -p "$TRY_DIR"
            unzip -q "$ZIP_FILE" -d "$TRY_DIR"

            while IFS= read -r PACKAGE_FILE; do
              if node -e "
                const p=require(process.argv[1]);
                process.exit(
                  p &&
                  p.scripts &&
                  p.scripts['prepare:offline']
                    ? 0 : 1
                )
              " "$PACKAGE_FILE"; then

                PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

                if [ -f "$PROJECT_DIR/capacitor.config.json" ] || [ -f "$PROJECT_DIR/capacitor.config.ts" ]; then
                  echo "Correct project found in: $ZIP_FILE"
                  echo "Project directory: $PROJECT_DIR"

                  cp -a "$PROJECT_DIR"/. app/
                  FOUND="yes"
                  break 2
                fi
              fi
            done < <(find "$TRY_DIR" -type f -name package.json)
          done

          if [ "$FOUND" != "yes" ]; then
            echo "Could not find the Halaqati Capacitor project."
            echo "The correct ZIP must contain:"
            echo "- package.json with prepare:offline"
            echo "- capacitor.config.json or capacitor.config.ts"
            echo ""
            echo "ZIP files in repository root:"
            ls -lh ./*.zip 2>/dev/null || true
            exit 1
          fi

          APP_VERSION="$(node -p "require('./app/package.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "Building Halaqati v$APP_VERSION"
          echo "Selected package.json:"
          cat app/package.json
          echo ""
          echo "Project files:"
          ls -la app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing HALAQATI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing HALAQATI_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing HALAQATI_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing HALAQATI_KEY_PASSWORD" && exit 1)

          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify project scripts
        working-directory: app
        run: |
          echo "Available npm scripts:"
          npm run
          node -e "
            const p=require('./package.json');
            if(!p.scripts?.['prepare:offline']){
              throw new Error('prepare:offline script is missing from ROOT package.json');
            }
          "

      - name: Prepare offline files
        working-directory: app
        run: npm run prepare:offline

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Set Android version
        working-directory: app
        run: node scripts/configure-android-version.mjs

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned release APK not found"
            find app/android/app/build/outputs -type f || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$UNSIGNED" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "Halaqati-v${APP_VERSION}.apk"

          test -s "Halaqati-v${APP_VERSION}.apk"

      - name: Create update publish package
        working-directory: app
        run: |
          node scripts/make-update-publish.mjs "../Halaqati-v${APP_VERSION}.apk"

          echo "Update files:"
          ls -lh update-publish

          test -s update-publish/Halaqati-latest.apk
          test -s update-publish/version.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload update files
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: |
            app/update-publish/version.json
            app/update-publish/Halaqati-latest.apk
          if-no-files-found: error
