name: Build Halaqati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Halaqati project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            ls -la
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          mkdir -p app

          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE="$(find extracted -type f -name package.json | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json was not found inside ZIP"
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. app/

          ls -la app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Prepare offline files
        working-directory: app
        run: npm run prepare:offline

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v1.8-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
