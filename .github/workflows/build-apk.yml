name: Build Signed Halaqati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Halaqati project
        run: |
          set -e
          ZIP_FILE="./Halaqati_Offline_Capacitor_v2_9_BUILD_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Required ZIP was not found: $ZIP_FILE"
            echo "ZIP files currently in repository root:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Using exact ZIP: $ZIP_FILE"
          rm -rf extracted app
          mkdir -p extracted app
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE_FILE=""

          while IFS= read -r CANDIDATE; do
            if node -e "
              const fs=require('fs');
              const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));
              process.exit(p.scripts && p.scripts['prepare:offline'] ? 0 : 1);
            " "$CANDIDATE"; then
              PACKAGE_FILE="$CANDIDATE"
              break
            fi
          done < <(find extracted -type f -name package.json)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "Main Halaqati package.json was not found inside ZIP"
            echo "Found package.json files:"
            find extracted -type f -name package.json -print
            exit 1
          fi

          echo "Using app package: $PACKAGE_FILE"
          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          rm -rf app
          mkdir -p app
          cp -a "$PROJECT_DIR"/. app/

          APP_VERSION="$(node -p "require('./app/package.json').version")"

          if [ "$APP_VERSION" != "2.9.0" ]; then
            echo "Wrong package selected. Expected 2.9.0 but got $APP_VERSION"
            cat app/package.json
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building Halaqati v$APP_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing HALAQATI_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing HALAQATI_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing HALAQATI_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing HALAQATI_KEY_PASSWORD" && exit 1)
          printf '%s' "$KEYSTORE_B64" | base64 -d > halaqati-release.jks
          test -s halaqati-release.jks

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Verify offline package
        working-directory: app
        run: |
          echo "Package version: $(node -p "require('./package.json').version")"
          node -e "const p=require('./package.json'); if(!p.scripts?.['prepare:offline']) { console.error('prepare:offline script is missing'); process.exit(1) }"
          test -f scripts/prepare-offline.mjs
          echo "Offline package verified"

      - name: Prepare offline files
        working-directory: app
        run: npm run prepare:offline

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android
        working-directory: app
        run: npx cap sync android

      - name: Set Android version
        working-directory: app
        run: |
          set -e
          APP_VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a=0,b=0,c=0]=process.argv[1].split('.').map(Number); console.log(a*10000+b*100+c)" "$APP_VERSION")"
          GRADLE="android/app/build.gradle"

          echo "Setting Android version to $APP_VERSION ($VERSION_CODE)"
          test -f "$GRADLE"

          sed -E -i "s/versionCode[[:space:]]+[0-9]+/versionCode $VERSION_CODE/" "$GRADLE"
          sed -E -i "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"$APP_VERSION\"/" "$GRADLE"

          grep -nE 'versionCode|versionName' "$GRADLE"

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned release APK not found"
            find app/android/app/build/outputs -type f || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "Halaqati-v${APP_VERSION}.apk"
          test -s "Halaqati-v${APP_VERSION}.apk"

      - name: Create update publish package
        run: |
          set -e
          mkdir -p app/update-publish
          cp "Halaqati-v${APP_VERSION}.apk" app/update-publish/Halaqati-latest.apk

          VERSION_CODE="$(node -e "const [a=0,b=0,c=0]=process.argv[1].split('.').map(Number); console.log(a*10000+b*100+c)" "$APP_VERSION")"

          cat > app/update-publish/version.json <<EOF
          {
            "versionName": "${APP_VERSION}",
            "versionCode": ${VERSION_CODE},
            "apkUrl": "https://syounis212004-sys.github.io/halaqati-web/Halaqati-latest.apk",
            "mandatory": false,
            "notes": [
              "تحسين العمل بدون إنترنت والمزامنة التلقائية.",
              "تحسين حساب صفحات القرآن.",
              "إصلاح بناء وتوقيع نسخة Android."
            ]
          }
          EOF

          cat app/update-publish/version.json
          test -s app/update-publish/Halaqati-latest.apk
          test -s app/update-publish/version.json

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload update files
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: |
            app/update-publish/version.json
            app/update-publish/Halaqati-latest.apk
          if-no-files-found: error
