name: Halaqati v2.58.0 RC22 — Stable Sheets, Import & Programs

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Repository containing Halaqati_Native_Kotlin_v2_58_0_RC22_STABLE_IMPORT_PROGRAMS.zip; blank = this repository'
        default: ''
        type: string
      source_ref:
        description: 'Source branch, tag or commit'
        default: 'main'
        type: string
      variant:
        description: 'debug for testing; release for an update signed with your existing key'
        default: release
        type: choice
        options: [release, debug]

permissions:
  contents: write

concurrency:
  group: halaqati-v2580-rc22-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCHIVE_SHA256: c115272d36d844a2808990ce518c732b65cb9aa8f1a1c8060e80f948370fed30
  PROJECT_DIR: ${{ github.workspace }}/extracted/Halaqati_Native_Kotlin_v2.50.0_RC15
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.HALAQATI_SOURCE_TOKEN || secrets.SOURCE_PAT || secrets.GH_PAT || github.token }}
          path: source-repo
          persist-credentials: false

      - name: Verify exact RC22 v2.58.0 archive and extract
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          expected_name = 'Halaqati_Native_Kotlin_v2_58_0_RC22_STABLE_IMPORT_PROGRAMS.zip'
          matches = [
              p for p in Path('source-repo').rglob(expected_name)
              if '.git' not in p.parts
              and hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['ARCHIVE_SHA256']
          ]
          if len(matches) != 1:
              raise SystemExit(f'Upload exactly one {expected_name} with the expected SHA-256 to the selected repository/ref.')
          dest = Path('extracted').resolve()
          dest.mkdir(exist_ok=False)
          with zipfile.ZipFile(matches[0]) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt source ZIP member: {bad}')
              for info in z.infolist():
                  target = (dest / info.filename).resolve()
                  if not target.is_relative_to(dest):
                      raise SystemExit(f'Unsafe archive member: {info.filename}')
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'Symlinks are not allowed: {info.filename}')
              z.extractall(dest)
          project = Path(os.environ['PROJECT_DIR'])
          if not project.is_dir():
              raise SystemExit(f'Expected Halaqati project directory missing: {project}')
          print('Verified RC22 source SHA-256:', os.environ['ARCHIVE_SHA256'])
          print('Project:', project)
          PY

      - name: RC22 database contract and required migrations
        timeout-minutes: 1
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -s migration/20260926_v2461_rc11_smart_plan_phases.sql
          test -s migration/20260926_v2462_rc11_2_phase_consistency.sql
          test -s migration/20260927_v2463_rc11_3_bulk_cycle_stability.sql
          test -s migration/20260927_v2471_rc12_1_stability_certificates_core.sql
          test -s POWER_RC14_GUARDIAN_MANAGEMENT_DOCUMENT_RELIABILITY_AR.md
          grep -q "create table if not exists public.certificates" migration/20260927_v2471_rc12_1_stability_certificates_core.sql
          grep -q "rc121_issue_certificate" migration/20260927_v2471_rc12_1_stability_certificates_core.sql
          mkdir -p ci-logs
          cp migration/20260927_v2471_rc12_1_stability_certificates_core.sql ci-logs/RC12_1_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20260928_v2500_rc15_tathbit_first_class_sync_integrity.sql
          grep -q "add value if not exists 'tathbit'" migration/20260928_v2500_rc15_tathbit_first_class_sync_integrity.sql
          test -s migration/20260929_v2502_rc15_2_tathbit_core_monthly.sql
          grep -q "rc152_roll_tathbit_months" migration/20260929_v2502_rc15_2_tathbit_core_monthly.sql
          cp migration/20260929_v2502_rc15_2_tathbit_core_monthly.sql ci-logs/RC15_2_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20260929_v2520_rc17_guardian_experience.sql
          grep -q "guardian_child_overview" migration/20260929_v2520_rc17_guardian_experience.sql
          cp migration/20260929_v2520_rc17_guardian_experience.sql ci-logs/RC17_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20260929_v2521_rc17_1_consistency_performance.sql
          grep -q "guardian_child_overview" migration/20260929_v2521_rc17_1_consistency_performance.sql
          grep -q "'activities'" migration/20260929_v2521_rc17_1_consistency_performance.sql
          grep -q "session_exists" migration/20260929_v2521_rc17_1_consistency_performance.sql
          cp migration/20260929_v2521_rc17_1_consistency_performance.sql ci-logs/RC17_1_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql
          grep -q "rc171_latest_activity_anchor" migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql
          grep -q "last_activity" migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql
          grep -q "scope_type = 'category'" migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql
          grep -q "rc152_roll_tathbit_months" migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql
          cp migration/20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql ci-logs/RC17_1_BUILD_FIX3_REQUIRED_SUPABASE_MIGRATION.sql
          echo "::notice::RC17 requires migration 20260929_v2520_rc17_guardian_experience.sql applied BEFORE RC17.1."
          echo "::notice::RC17.1 requires additive migration 20260929_v2521_rc17_1_consistency_performance.sql applied AFTER RC17."
          echo "::notice::BUILD FIX 3 requires 20260930_v2522_rc17_1_build_fix3_smart_plan_continuity.sql applied AFTER v2521 for last-activity continuity, guardian category priority, and Tathbit monthly continuation."
          echo "::notice::BUILD FIX 5 adds no database schema migration; Tilawah rubric data is stored in the existing selection_data JSON. Keep v2521 + v2522 applied."
          echo "::notice::BUILD FIX 7 adds no database schema migration; it restores legacy 2.44 release signing compatibility, derives the APK certificate from the existing keystore, and allows Google OAuth fallback when no native Web Client ID is configured."
          test -s migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          grep -q "create or replace function public.guardian_children" migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          grep -q "create table if not exists public.smart_plan_month_archives" migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          grep -q "create or replace function public.rc18_start_month" migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          grep -q "create table if not exists public.student_badge_awards" migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          grep -q "create table if not exists public.management_audit_log" migration/20261002_v2540_rc18_privacy_monthly_achievements.sql
          cp migration/20261002_v2540_rc18_privacy_monthly_achievements.sql ci-logs/RC18_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          grep -q "create or replace function public.rc182_update_session_details" migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          grep -q "create or replace function public.rc182_start_month" migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          grep -q "rc182_refresh_student_badges_exact" migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          grep -q "v_hifz_end := least(v_month_end, v_month_start + 21)" migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          grep -q "v_sard_start := least(v_month_end, v_month_start + 22)" migration/20261002_v2542_rc18_2_session_monthly_continuity.sql
          cp migration/20261002_v2542_rc18_2_session_monthly_continuity.sql ci-logs/RC18_2_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20261002_v2550_rc19_smart_plan_control_center.sql
          grep -q "create table if not exists public.smart_plan_health_daily" migration/20261002_v2550_rc19_smart_plan_control_center.sql
          grep -q "create or replace function public.rc19_record_plan_health" migration/20261002_v2550_rc19_smart_plan_control_center.sql
          grep -q "create or replace function public.rc19_start_month" migration/20261002_v2550_rc19_smart_plan_control_center.sql
          grep -q "'fixed_sard_target',25" migration/20261002_v2550_rc19_smart_plan_control_center.sql
          cp migration/20261002_v2550_rc19_smart_plan_control_center.sql ci-logs/RC19_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20261002_v2551_rc19_1_month_phase_isolation_hotfix.sql
          grep -q "rc191_isolate_cross_month_phases" migration/20261002_v2551_rc19_1_month_phase_isolation_hotfix.sql
          grep -q "phase_order=phase_order+100" migration/20261002_v2551_rc19_1_month_phase_isolation_hotfix.sql
          cp migration/20261002_v2551_rc19_1_month_phase_isolation_hotfix.sql ci-logs/RC19_1_REQUIRED_SUPABASE_MIGRATION.sql
          test -s migration/20261002_v2560_rc20_ui_document_consistency.sql
          grep -q "alter table public.halaqas add column if not exists archived_at" migration/20261002_v2560_rc20_ui_document_consistency.sql
          grep -q "halaqas_archived_at_idx" migration/20261002_v2560_rc20_ui_document_consistency.sql
          cp migration/20261002_v2560_rc20_ui_document_consistency.sql ci-logs/RC20_REQUIRED_SUPABASE_MIGRATION.sql
          echo "::warning::RC19.1 requires v2540, then v2542, then v2550, then v2551. The live production Supabase project already has v2551 applied; keep the file for reproducibility/new environments."
          echo "::notice::RC20 requires v2560 after v2551 for halaqa soft archive metadata. The live production Supabase project already has v2560 applied."
          test -s migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql
          grep -q "create table if not exists public.student_halaqa_memberships" migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql
          grep -q "add column if not exists halaqa_type" migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql
          grep -q "students_secondary_membership_select" migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql
          cp migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql ci-logs/RC21_REQUIRED_SUPABASE_MIGRATION.sql
          echo "::notice::RC21 requires v2570 after v2560 for multi-halaqa membership/program metadata. The live production Supabase project already has RC21 applied."
          test -s migration/20261005_v2580_rc22_program_metadata_import_ux.sql
          grep -q "program_specialization" migration/20261005_v2580_rc22_program_metadata_import_ux.sql
          grep -q "program_level" migration/20261005_v2580_rc22_program_metadata_import_ux.sql
          grep -q "assessment_type" migration/20261005_v2580_rc22_program_metadata_import_ux.sql
          grep -q "affects_primary_plan" migration/20261005_v2580_rc22_program_metadata_import_ux.sql
          cp migration/20261005_v2580_rc22_program_metadata_import_ux.sql ci-logs/RC22_REQUIRED_SUPABASE_MIGRATION.sql
          echo "::notice::RC22 requires v2580 after v2570 for program specialization/level/assessment metadata."
          echo "::notice::RC15.2 requires migrations 20260928_v2500_rc15, 20260928_v2501_rc15_1 AND 20260929_v2502_rc15_2 applied manually BEFORE installing the APK. CI never runs live DDL."

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13 with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Ensure SDK 36 is available
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Fetch verified Cairo font for Compose and local documents
        timeout-minutes: 2
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-cairo-font.py
          test -s app/src/main/res/font/cairo.ttf
          test -s app/src/main/assets/documents/cairo.ttf

      - name: Restore Firebase and optional release signing
        timeout-minutes: 2
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FIREBASE_JSON_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID_SECRET: ${{ secrets.HALAQATI_GOOGLE_WEB_CLIENT_ID }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          b64 = os.environ.get('FIREBASE_JSON_B64', '')
          raw = base64.b64decode(b64).decode() if b64 else os.environ.get('FIREBASE_JSON', '')
          if not raw:
              raise SystemExit('Missing HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 or HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON')
          data = json.loads(raw)
          packages = [c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])]
          if 'com.mohammedsamir.halaqati' not in packages:
              raise SystemExit('Firebase package mismatch')
          Path('app/google-services.json').write_text(raw)
          web_client = ''
          for client in data.get('client', []):
              for oauth in client.get('oauth_client', []):
                  if oauth.get('client_type') == 3 and oauth.get('client_id'):
                      web_client = oauth['client_id']; break
              if web_client: break
          web_client = web_client or os.environ.get('GOOGLE_WEB_CLIENT_ID_SECRET', '').strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('GOOGLE_WEB_CLIENT_ID=' + web_client + '\n')
          if not web_client:
              print('NOTICE: Native Google Web Client ID is not configured; the app will use the existing Supabase Google OAuth fallback.')
          if os.environ['VARIANT'] == 'release':
              for name in ['KEYSTORE_B64','HALAQATI_STORE_PASSWORD','HALAQATI_KEY_ALIAS','HALAQATI_KEY_PASSWORD']:
                  if not os.environ.get(name): raise SystemExit('Missing release signing secret: ' + name)
              keystore = Path(os.environ['RUNNER_TEMP']) / 'halaqati-release.jks'
              keystore.write_bytes(base64.b64decode(os.environ['KEYSTORE_B64']))
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('HALAQATI_KEYSTORE_PATH=' + str(keystore) + '\n')
          print('Firebase / Google auth / legacy release signing inputs validated.')
          PY
          if [ "$VARIANT" = release ]; then
            KEYSTORE="$RUNNER_TEMP/halaqati-release.jks"
            test -s "$KEYSTORE"
            CERT_SHA256="$(keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias "$HALAQATI_KEY_ALIAS" \
              -storepass "$HALAQATI_STORE_PASSWORD" 2>/dev/null \
              | awk -F': ' '/SHA256:/{print $2; exit}')"
            test -n "$CERT_SHA256" || { echo 'Unable to derive SHA-256 signing certificate from the legacy keystore'; exit 1; }
            echo "HALAQATI_SIGNING_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
            echo 'Legacy 2.44 signing keystore validated and certificate fingerprint derived.'
          fi

      - name: RC22 targeted source and regression gates
        id: source_gates
        continue-on-error: true
        timeout-minutes: 18
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo '=== Compiler/source regression ==='
            timeout 120s python3 scripts/compiler-regression-check.py
            echo '=== RC20/RC21 compiler guard ==='
            timeout 120s python3 scripts/rc20-build-fix1-check.py
            echo '=== Guardian role/privacy regression ==='
            timeout 120s python3 scripts/rc17-role-experience-check.py
            echo '=== Smart-plan continuity regression ==='
            timeout 120s python3 scripts/rc17-1-build-fix3-continuity-check.py
            echo '=== RC19 Smart Plan Control Center ==='
            timeout 120s python3 scripts/rc19-smart-plan-control-center-check.py
            echo '=== RC21 Multi-Halaqa + Compact UX ==='
            timeout 120s python3 scripts/rc21-multi-halaqa-compact-ux-check.py
            echo '=== RC22 Stable Sheets, Reliable Import & Program Profiles ==='
            timeout 120s python3 scripts/rc22-stable-import-program-check.py
            echo '=== UI/UX Pro Max ==='
            timeout 120s python3 scripts/uiux-pro-max-check.py
            echo '=== Full release parity ==='
            timeout 120s python3 scripts/full-release-parity-check.py
            echo '=== Release contract ==='
            timeout 120s python3 scripts/release-contract-check.py
            echo '=== Pure Kotlin self-tests ==='
            timeout 480s bash scripts/run-kotlin-selftests.sh
          } 2>&1 | tee ci-logs/rc21-source-gates.log

      - name: RC22 browser/PDF visual fixture gate
        id: visual_gate
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'pillow==12.3.0' 'playwright==1.63.0' 'pypdf==6.19.0'
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          python3 scripts/rc20-report-layout-visual-check.py --out ci-logs/rc20-report-layout
          cat ci-logs/rc20-report-layout/results.json
          python3 scripts/rc13-render-fixtures.py --verify --out ci-logs/rc14-fixtures
          cat ci-logs/rc14-fixtures/RC13_FIXTURE_RESULTS.json

      - name: Targeted RC22 Gradle unit tests
        id: targeted_tests
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          testTask=testDebugUnitTest
          if [ "$VARIANT" = release ]; then testTask=testReleaseUnitTest; fi
          python3 scripts/ci-build.py "$testTask" 540 --tests com.mohammedsamir.halaqati.plans.SmartPlanHealthRulesTest --tests com.mohammedsamir.halaqati.plans.SmartPlanTagRulesTest --tests com.mohammedsamir.halaqati.plans.SmartPlanEngineTest --tests com.mohammedsamir.halaqati.plans.SmartPlanPhaseEngineTest --tests com.mohammedsamir.halaqati.quran.QuranRangeEngineTest

      - name: Compile chosen Kotlin variant
        id: compile_kotlin
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          task=compileDebugKotlin
          if [ "$VARIANT" = release ]; then task=compileReleaseKotlin; fi
          python3 scripts/ci-build.py "$task" 540

      - name: Compile RC22 instrumentation regression test
        id: compile_android_test
        continue-on-error: true
        timeout-minutes: 8
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ci-build.py compileDebugAndroidTestKotlin 420

      - name: Full Gradle unit tests
        id: full_tests
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          testTask=testDebugUnitTest
          if [ "$VARIANT" = release ]; then testTask=testReleaseUnitTest; fi
          python3 scripts/ci-build.py "$testTask" 540

      - name: Lint chosen variant
        id: lint
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          lintTask=lintDebug
          if [ "$VARIANT" = release ]; then lintTask=lintRelease; fi
          python3 scripts/ci-build.py "$lintTask" 540

      - name: Assemble chosen APK
        id: assemble
        continue-on-error: true
        timeout-minutes: 10
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          assembleTask=assembleDebug
          if [ "$VARIANT" = release ]; then assembleTask=assembleRelease; fi
          python3 scripts/ci-build.py "$assembleTask" 540

      - name: Verify APK identity and signing
        id: apk_verify
        continue-on-error: true
        timeout-minutes: 3
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          mkdir -p verified ci-logs
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > ci-logs/apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > ci-logs/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > ci-logs/manifest.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          badging = Path('ci-logs/badging.txt').read_text()
          assert "name='com.mohammedsamir.halaqati'" in badging
          assert "versionCode='25800'" in badging
          assert int(re.search(r"versionCode='(\d+)'", badging).group(1)) > 24400, 'must upgrade legacy 2.44 (24400)'
          assert 'applicationIdSuffix' not in Path('app/build.gradle.kts').read_text()
          expected_name = '2.58.0' if os.environ['VARIANT'] == 'release' else '2.58.0-debug'
          assert f"versionName='{expected_name}'" in badging, f'Unexpected versionName; expected {expected_name}'
          assert "sdkVersion:'23'" in badging
          assert "targetSdkVersion:'36'" in badging
          if os.environ['VARIANT'] == 'release':
              cert_text = Path('ci-logs/apksigner.txt').read_text()
              match = re.search(r'Signer #1 certificate SHA-256 digest: (\S+)', cert_text)
              assert match, 'Signing certificate digest missing'
              normalize = lambda v: re.sub(r'[:\s]', '', v).lower()
              expected = os.environ.get('HALAQATI_SIGNING_CERT_SHA256', '')
              assert expected, 'Derived signing certificate fingerprint missing'
              assert normalize(match.group(1)) == normalize(expected), 'Signing certificate mismatch versus restored legacy keystore'
          PY
          OUT="verified/Halaqati-v2.58.0-$VARIANT.apk"
          cp "$APK" "$OUT"
          cp migration/20261002_v2540_rc18_privacy_monthly_achievements.sql verified/RC18_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261002_v2542_rc18_2_session_monthly_continuity.sql verified/RC18_2_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261002_v2550_rc19_smart_plan_control_center.sql verified/RC19_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261002_v2551_rc19_1_month_phase_isolation_hotfix.sql verified/RC19_1_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261002_v2560_rc20_ui_document_consistency.sql verified/RC20_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261004_v2570_rc21_multi_halaqa_compact_sessions.sql verified/RC21_REQUIRED_SUPABASE_MIGRATION.sql
          cp migration/20261005_v2580_rc22_program_metadata_import_ux.sql verified/RC22_REQUIRED_SUPABASE_MIGRATION.sql
          (cd verified && sha256sum *.apk RC18_REQUIRED_SUPABASE_MIGRATION.sql RC18_2_REQUIRED_SUPABASE_MIGRATION.sql RC19_REQUIRED_SUPABASE_MIGRATION.sql RC19_1_REQUIRED_SUPABASE_MIGRATION.sql RC20_REQUIRED_SUPABASE_MIGRATION.sql RC21_REQUIRED_SUPABASE_MIGRATION.sql RC22_REQUIRED_SUPABASE_MIGRATION.sql > SHA256SUMS.txt)

      - name: Final RC22 gate aggregation
        if: always()
        env:
          SOURCE_GATES: ${{ steps.source_gates.outcome }}
          VISUAL_GATE: ${{ steps.visual_gate.outcome }}
          TARGETED_TESTS: ${{ steps.targeted_tests.outcome }}
          COMPILE_KOTLIN: ${{ steps.compile_kotlin.outcome }}
          COMPILE_ANDROID_TEST: ${{ steps.compile_android_test.outcome }}
          FULL_TESTS: ${{ steps.full_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          APK_VERIFY: ${{ steps.apk_verify.outcome }}
        run: |
          set -euo pipefail
          failed=0
          for item in \
            "source-gates=$SOURCE_GATES" \
            "visual-gate=$VISUAL_GATE" \
            "targeted-tests=$TARGETED_TESTS" \
            "compile-kotlin=$COMPILE_KOTLIN" \
            "compile-android-test=$COMPILE_ANDROID_TEST" \
            "full-tests=$FULL_TESTS" \
            "lint=$LINT" \
            "assemble=$ASSEMBLE" \
            "apk-verify=$APK_VERIFY"; do
            name="${item%%=*}"
            state="${item#*=}"
            printf '%-24s %s\n' "$name" "$state"
            if [ "$state" != success ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo '::error::One or more RC22 gates failed. This workflow intentionally continued so a single run exposes all independent build problems. Review diagnostics/artifacts above.'
            exit 1
          fi
          echo 'All RC22 stable-sheet, import, program-profile, RC21 multi-halaqa, UI/document, smart-plan, privacy, visual, Gradle, lint, assemble, and APK verification gates passed.'

      - name: Prepare direct in-app update package
        if: ${{ inputs.variant == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 scripts/make-update-publish.py
          test -s update-publish/Halaqati-latest.apk
          test -s update-publish/version.json
          python3 - <<'PY2'
          import json
          from pathlib import Path
          data=json.loads(Path('update-publish/version.json').read_text(encoding='utf-8'))
          assert data['versionName']=='2.58.0'
          assert int(data['versionCode'])==25700
          assert data['apkUrl']=='https://syounis212004-sys.github.io/halaqati-web/Halaqati-latest.apk'
          print('Direct-update manifest verified:', data['versionName'], data['versionCode'])
          PY2
          cp update-publish/version.json verified/version.json
          (cd update-publish && zip -q -X ../verified/Halaqati-v2.58.0-publish-update.zip Halaqati-latest.apk version.json)
          sha256sum verified/Halaqati-v2.58.0-publish-update.zip >> verified/SHA256SUMS.txt

      - name: Create or refresh GitHub Release v2.58.0 RC22
        if: ${{ inputs.variant == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=verified/Halaqati-v2.58.0-release.apk
          UPDATE=verified/Halaqati-v2.58.0-publish-update.zip
          test -s "$APK"
          test -s "$UPDATE"
          if gh release view v2.58.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.58.0 "$APK" "$UPDATE" verified/version.json verified/RC18_REQUIRED_SUPABASE_MIGRATION.sql verified/RC18_2_REQUIRED_SUPABASE_MIGRATION.sql verified/RC19_REQUIRED_SUPABASE_MIGRATION.sql verified/RC19_1_REQUIRED_SUPABASE_MIGRATION.sql verified/RC20_REQUIRED_SUPABASE_MIGRATION.sql verified/RC21_REQUIRED_SUPABASE_MIGRATION.sql verified/RC22_REQUIRED_SUPABASE_MIGRATION.sql --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v2.58.0 "$APK" "$UPDATE" verified/version.json verified/RC18_REQUIRED_SUPABASE_MIGRATION.sql verified/RC18_2_REQUIRED_SUPABASE_MIGRATION.sql verified/RC19_REQUIRED_SUPABASE_MIGRATION.sql verified/RC19_1_REQUIRED_SUPABASE_MIGRATION.sql verified/RC20_REQUIRED_SUPABASE_MIGRATION.sql verified/RC21_REQUIRED_SUPABASE_MIGRATION.sql verified/RC22_REQUIRED_SUPABASE_MIGRATION.sql \
              --repo "$GITHUB_REPOSITORY" \
              --title "Halaqati v2.58.0 RC22 — Stable Sheets, Import & Programs" \
              --notes "RC22 يثبت شاشة الاستيراد، يدعم CSV/TXT وXLSX وDOCX حتى مع MIME عام، ويوسع ملفات البرامج بالتخصص والمستوى ونمط التقييم وتأثير البرنامج على الخطة الأساسية. يتطلب migration v2580 بعد v2570 في البيئات التي لم تطبقه."
          fi

      - name: Publish direct update to halaqati-web when a cross-repo token is configured
        if: ${{ inputs.variant == 'release' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          WEB_TOKEN: ${{ secrets.HALAQATI_WEB_TOKEN || secrets.GH_PAT || secrets.SOURCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_TOKEN:-}" ]; then
            echo '::notice::No HALAQATI_WEB_TOKEN/GH_PAT/SOURCE_PAT is configured. The signed publish-update ZIP is still attached to this run and GitHub Release; publish it to halaqati-web to activate in-app update discovery.'
            exit 0
          fi
          rm -rf "$RUNNER_TEMP/halaqati-web"
          git clone --depth 1 "https://x-access-token:${WEB_TOKEN}@github.com/syounis212004-sys/halaqati-web.git" "$RUNNER_TEMP/halaqati-web"
          cp update-publish/Halaqati-latest.apk "$RUNNER_TEMP/halaqati-web/Halaqati-latest.apk"
          cp update-publish/version.json "$RUNNER_TEMP/halaqati-web/version.json"
          cd "$RUNNER_TEMP/halaqati-web"
          git config user.name 'halaqati-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Halaqati-latest.apk version.json
          if git diff --cached --quiet; then
            echo 'Updater files already match v2.58.0 RC22.'
          else
            git commit -m 'Publish Halaqati v2.58.0 RC22 direct update'
            git push origin HEAD:main
          fi

      - name: Upload APK only after every gate passes
        uses: actions/upload-artifact@v6
        with:
          name: Halaqati-v2.58.0-RC21-BUILD-FIX1-${{ inputs.variant }}
          path: ${{ env.PROJECT_DIR }}/verified/
          if-no-files-found: error
          retention-days: 14

      - name: Upload RC19 diagnostics and rendered fixtures even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Halaqati-v2.58.0-RC21-BUILD-FIX1-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.PROJECT_DIR }}/ci-logs/
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
