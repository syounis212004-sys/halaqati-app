name: Execution v1.2 validation

on:
  workflow_call:
  push:
    branches: [fix/execution-v1-2, main]
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/execution-v12-validation.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare debug fixtures
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/madina.json" https://digitalkhatt.org/assets/layouts/madina.json
          echo "5de6e0c60d8a402b37483fed4f799eeefaebd5edd94b67ff1ac8d8e9ba5ff358  $RUNNER_TEMP/madina.json" | sha256sum -c -
          python3 -I source/scripts/dk/make_dk_assets.py "$RUNNER_TEMP/madina.json" source/app/src/main/assets/dk
          python3 -I source/scripts/dk/verify_pack.py source/app/src/main/assets/dk
          python3 source/scripts/fetch-cairo-font.py
          cat > source/app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"halaqati-v12-debug-fixture"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:1234567890abcdef","android_client_info":{"package_name":"com.mohammedsamir.halaqati"}},"api_key":[{"current_key":"offline-fixture"}]}],"configuration_version":"1"}
          JSON
      - name: Restore pinned Robolectric API 35 fixture
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7
          key: robolectric-api35-33c2d7cc4186
      - name: Verify or fetch Robolectric API 35 fixture
        run: |
          set -euo pipefail
          version=15-robolectric-12650502-i7
          relative="org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
          jar="$HOME/.m2/repository/$relative"
          digest=33c2d7cc4186d4605269d5d411fa1818972c5b30a9f70bfbbd3d430b076af52f
          if ! printf '%s  %s\n' "$digest" "$jar" | sha256sum --check --status; then
            mkdir -p "$(dirname "$jar")"
            curl -fsSL --retry 4 --max-time 160 "https://maven-central.storage-download.googleapis.com/maven2/$relative" -o "$jar.part"
            printf '%s  %s\n' "$digest" "$jar.part" | sha256sum --check
            mv "$jar.part" "$jar"
          fi
      - name: Build APK and run unit tests
        working-directory: source
        env:
          SUPABASE_URL: https://staging.invalid
          SUPABASE_PUBLISHABLE_KEY: offline-fixture
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        run: |
          cat > "$RUNNER_TEMP/central-mirror.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
            def mirror = 'https://maven-central.storage-download.googleapis.com/maven2'
            settings.pluginManagement.repositories.maven { url = uri(mirror) }
            settings.dependencyResolutionManagement.repositories.maven { url = uri(mirror) }
          }
          GRADLE
          # The in-process Kotlin compiler and Compose IR need more than 4 GiB.
          # Size the heap to the actual runner, reserving memory for OS and native tooling.
          available_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          heap_mib=$((available_kib / 1024 - 2304))
          if [ "$heap_mib" -gt 8192 ]; then heap_mib=8192; fi
          if [ "$heap_mib" -lt 4608 ]; then heap_mib=4608; fi
          free -h
          echo "Gradle heap: ${heap_mib} MiB"
          jvm="-Xmx${heap_mib}m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
          # Room processing is isolated from the large Compose/application compilation.
          bash scripts/gradle-with-diagnostics.sh --no-daemon --max-workers=1 --console=plain "-Dorg.gradle.jvmargs=$jvm" --init-script "$RUNNER_TEMP/central-mirror.gradle" :offline-db:assembleDebug
          git diff --exit-code -- app/schemas
          bash scripts/gradle-with-diagnostics.sh --no-daemon --max-workers=1 --console=plain "-Dorg.gradle.jvmargs=$jvm" --init-script "$RUNNER_TEMP/central-mirror.gradle" :app:assembleDebug
          # Fresh daemon for Robolectric, rather than keeping the large compiler heap resident.
          bash scripts/gradle-with-diagnostics.sh --no-daemon --max-workers=1 --console=plain "-Dorg.gradle.jvmargs=$jvm" --init-script "$RUNNER_TEMP/central-mirror.gradle" :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halaqati-v12-debug-verification
          path: |
            source/app/build/outputs/apk/debug/app-debug.apk
            source/app/build/test-results/testDebugUnitTest/
            source/build/reports/profile/
            source/offline-db/build/reports/

  education-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: education_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d education_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test educational assessment SQL on disposable database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/education/tests
          docker cp source/migration/20261128120700_educational_assessments_v12.sql "$PG_CONTAINER:/tmp/education/"
          docker cp source/migration/tests/educational_assessments_v12.sql "$PG_CONTAINER:/tmp/education/tests/"
          docker exec "$PG_CONTAINER" psql -U postgres -d education_fixture -v ON_ERROR_STOP=1 -f /tmp/education/tests/educational_assessments_v12.sql

  lifecycle-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: lifecycle_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d lifecycle_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test phase-four lifecycle and payment protection
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/lifecycle/tests /tmp/lifecycle/proposals
          docker cp source/migration/proposals/phase_four_lifecycle.sql "$PG_CONTAINER:/tmp/lifecycle/proposals/"
          docker cp source/migration/tests/phase_four_lifecycle.sql "$PG_CONTAINER:/tmp/lifecycle/tests/"
          docker exec "$PG_CONTAINER" psql -U postgres -d lifecycle_fixture -v ON_ERROR_STOP=1 -f /tmp/lifecycle/tests/phase_four_lifecycle.sql
      - name: Test association retirement transaction and relationship preservation
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U postgres retirement_fixture
          docker cp source/migration/proposals/phase_four_association_retirement.sql "$PG_CONTAINER:/tmp/lifecycle/proposals/"
          docker cp source/migration/tests/phase_four_association_retirement.sql "$PG_CONTAINER:/tmp/lifecycle/tests/"
          docker exec "$PG_CONTAINER" psql -U postgres -d retirement_fixture -v ON_ERROR_STOP=1 -f /tmp/lifecycle/tests/phase_four_association_retirement.sql

  guardian-activity-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: guardian_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d guardian_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test guardian activity and child isolation
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/guardian/tests
          docker cp source/migration/20261128120800_guardian_activity_overview_v12.sql "$PG_CONTAINER:/tmp/guardian/"
          docker cp source/migration/tests/guardian_activity_overview_v12.sql "$PG_CONTAINER:/tmp/guardian/tests/"
          docker exec "$PG_CONTAINER" psql -U postgres -d guardian_fixture -v ON_ERROR_STOP=1 -f /tmp/guardian/tests/guardian_activity_overview_v12.sql

  independent-scope-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: scope_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d scope_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify independent scope role isolation and idempotent session transition
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/scope/tests /tmp/scope/proposals
          docker cp source/migration/proposals/phase_four_independent_scope.sql "$PG_CONTAINER:/tmp/scope/proposals/"
          docker cp source/migration/tests/phase_four_independent_scope.sql "$PG_CONTAINER:/tmp/scope/tests/"
          docker exec "$PG_CONTAINER" psql -U postgres -d scope_fixture -v ON_ERROR_STOP=1 -f /tmp/scope/tests/phase_four_independent_scope.sql

  seven-points-contract-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: seven_fixture
        options: >-
          --health-cmd "pg_isready -U postgres -d seven_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test scoped staff, guardian summaries, same-day history, scoring and revision conflicts
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" mkdir -p /tmp/seven/tests /tmp/seven/proposals
          docker cp source/migration/20261128120800_guardian_activity_overview_v12.sql "$PG_CONTAINER:/tmp/seven/"
          docker cp source/migration/tests/guardian_activity_overview_v12.sql "$PG_CONTAINER:/tmp/seven/tests/"
          docker cp source/migration/tests/seven_points_contracts.sql "$PG_CONTAINER:/tmp/seven/tests/"
          docker cp source/migration/proposals/seven_points_scoped_projections.sql "$PG_CONTAINER:/tmp/seven/proposals/"
          docker cp source/migration/proposals/seven_points_tilawah_scoring.sql "$PG_CONTAINER:/tmp/seven/proposals/"
          docker exec "$PG_CONTAINER" psql -U postgres -d seven_fixture -v ON_ERROR_STOP=1 -f /tmp/seven/tests/seven_points_contracts.sql
