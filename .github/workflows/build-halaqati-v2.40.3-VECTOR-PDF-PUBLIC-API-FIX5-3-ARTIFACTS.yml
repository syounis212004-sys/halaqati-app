          fi
          grep -q 'PDF_SMOKE_PASS' /tmp/halaqati-pdf-smoke-dom.html || {
            echo "ERROR: PDF smoke test did not produce visible canvas output"
            tail -n 100 /tmp/halaqati-pdf-chrome.log || true
            exit 1
          }
          rm -f dist/pdf-smoke.html
          echo "PDF browser smoke test passed: row counts preserved and html2canvas output is non-blank."

      - name: v2.40.1 Auto-fit baseline browser smoke test
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/pdf-autofit-v2401-smoke.html dist/pdf-autofit-v2401-smoke.html
          python3 -m http.server 4177 --directory dist >/tmp/halaqati-v240-pdf-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "ERROR: Chrome/Chromium unavailable"; exit 1; }
          set +e
          timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --dump-dom http://127.0.0.1:4177/pdf-autofit-v2401-smoke.html > /tmp/halaqati-v240-pdf-dom.html 2>/tmp/halaqati-v240-pdf-chrome.log
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: v2.40 PDF Auto-fit browser smoke timed out/failed ($STATUS)"
            tail -n 80 /tmp/halaqati-v240-pdf-chrome.log || true
            exit 1
          fi
          grep -q 'PDF_AUTOFIT_V2401_PASS' /tmp/halaqati-v240-pdf-dom.html || { cat /tmp/halaqati-v240-pdf-dom.html; tail -n 80 /tmp/halaqati-v240-pdf-chrome.log; exit 1; }
          rm -f dist/pdf-autofit-v2401-smoke.html
          echo "PDF Auto-fit browser smoke passed ✅"

      - name: v2.40.3 Chromium vector PDF smoke test
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/pdf-vector-v2403-smoke.html
          test -s dist/core/cairo.css
          cp scripts/pdf-vector-v2403-smoke.html dist/pdf-vector-v2403-smoke.html

          python3 -m http.server 4183 --directory dist >/tmp/halaqati-v2403-vector-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME" || { echo "ERROR: Chrome/Chromium unavailable"; exit 1; }
          PDF=/tmp/halaqati-v2403-vector.pdf
          rm -f "$PDF"
          set +e
          timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --run-all-compositor-stages-before-draw --virtual-time-budget=8000 --no-pdf-header-footer --print-to-pdf="$PDF" http://127.0.0.1:4183/pdf-vector-v2403-smoke.html >/tmp/halaqati-v2403-vector-chrome.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] || [ ! -s "$PDF" ]; then
            echo "ERROR: Chromium vector PDF generation failed/timed out ($STATUS)"
            tail -n 120 /tmp/halaqati-v2403-vector-chrome.log || true
            exit 1
          fi

          if ! command -v pdftotext >/dev/null || ! command -v pdffonts >/dev/null || ! command -v pdfimages >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          pdftotext -layout "$PDF" /tmp/halaqati-v2403-vector.txt
          pdffonts "$PDF" > /tmp/halaqati-v2403-fonts.txt
          pdfimages -list "$PDF" > /tmp/halaqati-v2403-images.txt
          cat /tmp/halaqati-v2403-fonts.txt

          # Chromium + Poppler can legally split Arabic words, insert bidi controls,
          # tatweel/combining marks, or emit glyph runs in a different visual order.
          # Selectability is therefore validated by extracted Arabic *content volume*
          # and token diversity, not by one fragile branded word such as "حلقتي".
          python3 - <<'PY_ARABIC'
          import pathlib, unicodedata, re, sys

          p = pathlib.Path('/tmp/halaqati-v2403-vector.txt')
          raw = p.read_text(encoding='utf-8', errors='replace')
          text = unicodedata.normalize('NFKC', raw)

          # Remove bidi/control marks, tatweel and Arabic combining marks for robust checks.
          text = ''.join(ch for ch in text if unicodedata.category(ch) != 'Cf')
          text = text.replace('ـ', '')
          text_no_marks = ''.join(ch for ch in text if unicodedata.category(ch) not in {'Mn', 'Me'})

          arabic_re = re.compile(r'[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]')
          token_re = re.compile(r'[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]{2,}')
          arabic_chars = len(arabic_re.findall(text_no_marks))
          tokens = {t for t in token_re.findall(text_no_marks) if len(t) >= 2}

          # The smoke page intentionally contains many Arabic labels and two student names.
          # If pdftotext can recover this amount of Arabic, the PDF is genuinely selectable/searchable.
          if arabic_chars < 80 or len(tokens) < 10:
              print(f'ERROR: Arabic selectable-text validation failed: arabic_chars={arabic_chars}, distinct_tokens={len(tokens)}')
              print(raw)
              sys.exit(1)

          # Require several semantic labels, but allow partial success because RTL extraction
          # can split/reorder individual words depending on Poppler/Chromium versions.
          semantic_labels = ['تقرير', 'الطالب', 'الحفظ', 'الحضور', 'المسار', 'الأخطاء']
          hits = [w for w in semantic_labels if w in text_no_marks]
          if len(hits) < 3:
              print(f'ERROR: Arabic semantic-content validation failed: hits={hits}')
              print(raw)
              sys.exit(1)

          if '1234567890' not in text_no_marks:
              print('ERROR: Latin-digit PDF output missing')
              print(raw)
              sys.exit(1)

          print(f'Arabic selectable text OK: {arabic_chars} Arabic chars, {len(tokens)} distinct tokens, semantic_hits={hits} ✅')
          PY_ARABIC

          grep -qi 'Cairo' /tmp/halaqati-v2403-fonts.txt || { echo "ERROR: Cairo font is not embedded/used by Chromium PDF"; cat /tmp/halaqati-v2403-fonts.txt; exit 1; }
          # Ensure at least one embedded Cairo font has a Unicode map (selectable/searchable text).
          awk 'BEGIN{ok=0} /Cairo/ && / yes / {ok=1} END{exit ok?0:1}' /tmp/halaqati-v2403-fonts.txt || { echo "ERROR: Cairo font Unicode mapping missing"; cat /tmp/halaqati-v2403-fonts.txt; exit 1; }
          IMAGE_COUNT="$(awk 'NR>2 && $1 ~ /^[0-9]+$/ {n++} END{print n+0}' /tmp/halaqati-v2403-images.txt)"
          test "$IMAGE_COUNT" -eq 0 || { echo "ERROR: smoke report was rasterized into PDF images"; cat /tmp/halaqati-v2403-images.txt; exit 1; }
          rm -f dist/pdf-vector-v2403-smoke.html
          echo "v2.40.3 vector PDF verified: Chromium + Cairo + RTL + extractable text + zero raster page images ✅"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-web
          path: app/dist/
          if-no-files-found: error

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Pin Firebase Messaging for official Capacitor plugin
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIREBASEVERSION'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'firebaseMessagingVersion' in s:
              s=re.sub(r"firebaseMessagingVersion\s*=\s*['\"][^'\"]+['\"]", "firebaseMessagingVersion = '25.1.1'", s)
          else:
              marker='ext {'
              if marker not in s: raise SystemExit('variables.gradle does not contain ext block')
              s=s.replace(marker, marker+"\n    firebaseMessagingVersion = '25.1.1'", 1)
          p.write_text(s)
          print('Pinned official plugin Firebase Messaging runtime to 25.1.1')
          PYFIREBASEVERSION
          grep -q "firebaseMessagingVersion = '25.1.1'" android/variables.gradle

      - name: Install validated Firebase Android config
        working-directory: app
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          rm -f android/app/google-services.json
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -n "${GOOGLE_SERVICES_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          else
            echo "Firebase config absent: safe no-Push APK mode ✅"
            exit 0
          fi
          test -s android/app/google-services.json
          python3 - <<'PYFIREBASE'
          import json
          from pathlib import Path
          p=Path('android/app/google-services.json')
          d=json.loads(p.read_text())
          packages=[]
          for c in d.get('client',[]):
              packages.append(c.get('client_info',{}).get('android_client_info',{}).get('package_name'))
          assert 'com.mohammedsamir.halaqati' in packages, f'google-services.json does not contain com.mohammedsamir.halaqati: {packages}'
          assert d.get('project_info',{}).get('project_id'), 'Firebase project_id missing'
          print('Firebase Android config validated ✅')
          PYFIREBASE

      - name: Ensure Android notification permission
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"
          if ! grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"; then
            python3 - <<'PYPERM'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          if marker not in s: raise SystemExit('Android manifest application tag missing')
          s=s.replace(marker, '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n\n    '+marker, 1)
          p.write_text(s)
          PYPERM
          fi
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"

      - name: Sync Android from same Vite dist
        working-directory: app
        run: npx cap sync android

      - name: Verify Halaqati Vector PDF plugin is synced
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_JSON="android/app/src/main/assets/capacitor.plugins.json"
          test -s "$PLUGIN_JSON"
          grep -q 'halaqati-pdf' "$PLUGIN_JSON" || { echo "ERROR: halaqati-pdf package not linked by cap sync"; cat "$PLUGIN_JSON"; exit 1; }
          grep -q 'com.mohammedsamir.halaqati.pdf.HalaqatiPdfPlugin' "$PLUGIN_JSON" || { echo "ERROR: HalaqatiPdfPlugin class not registered"; cat "$PLUGIN_JSON"; exit 1; }
          grep -R -q 'halaqati-pdf' android/capacitor.settings.gradle android/settings.gradle android/app/capacitor.build.gradle 2>/dev/null || { echo "ERROR: vector PDF Android module not linked"; exit 1; }
          echo "HalaqatiPdf Chromium/WebView plugin linked ✅"

      - name: Compile HalaqatiPdf with Android Public SDK only
        working-directory: app/android
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          LOG_FILE="$RUNNER_TEMP/halaqati-pdf-compile.log"
          set +e
          ./gradlew :halaqati-pdf:compileReleaseJavaWithJavac --console=plain --no-daemon 2>&1 | tee "$LOG_FILE"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "================ HalaqatiPdf compiler summary ================"
            grep -nE '(^|[^[:alpha:]])error:|FAILURE:|Execution failed for task|What went wrong:|Could not (compile|resolve)|cannot find symbol|incompatible types' "$LOG_FILE" | tail -n 80 || true
            echo "==============================================================="
            exit "$RC"
          fi
          echo "HalaqatiPdf Public Android SDK compile passed ✅"

      - name: Verify official Capacitor Push plugin is synced
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -d node_modules/@capacitor/push-notifications
          test -s node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java
          grep -q 'FirebaseMessaging.getInstance()' node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java
          grep -q 'getToken()' node_modules/@capacitor/push-notifications/android/src/main/java/com/capacitorjs/plugins/pushnotifications/PushNotificationsPlugin.java
          if ! grep -R -q "capacitor-push-notifications\|@capacitor/push-notifications" android/capacitor.settings.gradle android/settings.gradle android/app/capacitor.build.gradle 2>/dev/null; then
            echo "ERROR: official Capacitor PushNotifications plugin was not linked by cap sync"
            cat android/capacitor.settings.gradle 2>/dev/null || true
            exit 1
          fi
          test ! -d node_modules/halaqati-push-bridge
          ! grep -R -q 'HalaqatiPushBridgePlugin' android 2>/dev/null
          echo "Official @capacitor/push-notifications linked; custom bridge absent ✅"

      - name: Verify Firebase Google Services processing
        if: env.VITE_HALAQATI_FIREBASE_CONFIGURED == 'true'
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          grep -q "com.google.gms:google-services" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew :app:processReleaseGoogleServices
          cd ..
          # The Google Services plugin can write generated resources to different
          # directories depending on the AGP/plugin version. Verify by content.
          VALUES="$(find android/app/build/generated -type f -name 'values.xml' -print 2>/dev/null | while read -r f; do
            if grep -q 'google_app_id' "$f" && grep -q 'gcm_defaultSenderId' "$f"; then
              echo "$f"
              break
            fi
          done)"
          if [ -z "${VALUES:-}" ] || [ ! -s "$VALUES" ]; then
            echo "ERROR: Google Services task succeeded, but generated Firebase values could not be located."
            echo "Generated files:"
            find android/app/build/generated -type f -print 2>/dev/null | head -200 || true
            exit 1
          fi
          echo "Firebase resources found at: $VALUES"
          grep -q "google_app_id" "$VALUES"
          grep -q "gcm_defaultSenderId" "$VALUES"
          echo "Firebase Google Services processed for release APK ✅"

      - name: Verify Firebase runtime + official PushNotifications compile
        if: env.VITE_HALAQATI_FIREBASE_CONFIGURED == 'true'
        working-directory: app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if ! ./gradlew :app:compileReleaseJavaWithJavac --console=plain > /tmp/halaqati-app-compile.log 2>&1; then
            echo "===== Android compile error summary ====="
            grep -nE "(^| )error:|FAILURE:|What went wrong|Could not|Execution failed|Caused by:" /tmp/halaqati-app-compile.log | tail -n 120 || true
            echo "===== Android compile tail ====="
            tail -n 220 /tmp/halaqati-app-compile.log || true
            exit 1
          fi
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > /tmp/halaqati-release-deps.txt
          grep -q 'com.google.firebase:firebase-messaging:25.1.1' /tmp/halaqati-release-deps.txt

          MERGED_MANIFEST="app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          if [ ! -s "$MERGED_MANIFEST" ]; then
            MERGED_MANIFEST="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/release/' | head -n 1)"
          fi
          test -s "$MERGED_MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MERGED_MANIFEST"
          grep -q 'com.capacitorjs.plugins.pushnotifications.MessagingService' "$MERGED_MANIFEST"
          grep -q 'com.google.firebase.MESSAGING_EVENT' "$MERGED_MANIFEST"

          PLUGIN_JSON="app/src/main/assets/capacitor.plugins.json"
          test -s "$PLUGIN_JSON"
          grep -q '@capacitor/push-notifications' "$PLUGIN_JSON"
          grep -q 'com.capacitorjs.plugins.pushnotifications.PushNotificationsPlugin' "$PLUGIN_JSON"
          ! grep -q 'HalaqatiPushBridgePlugin' "$PLUGIN_JSON"
          echo "Official Capacitor PushNotifications + FCM registration token path compiled ✅"

      - name: Set Android version
        working-directory: app
        run: node scripts/configure-android-version.mjs

      - name: Build release APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" Halaqati-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks halaqati-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "Halaqati-v${APP_VERSION}.apk" \
            Halaqati-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "Halaqati-v${APP_VERSION}.apk"

      - name: Create update publish package
        working-directory: app
        run: node scripts/make-update-publish.mjs "../Halaqati-v${APP_VERSION}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-signed-apk
          path: Halaqati-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-v${{ env.APP_VERSION }}-publish-update
          path: |
            app/update-publish/version.json
            app/update-publish/Halaqati-latest.apk
          if-no-files-found: error
