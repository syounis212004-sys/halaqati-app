            --dump-dom http://127.0.0.1:4173/pdf-smoke.html \
            > /tmp/halaqati-pdf-smoke-dom.html 2>/tmp/halaqati-pdf-chrome.log
          STATUS=$?
          set -e

          cat /tmp/halaqati-pdf-smoke-dom.html || true
          if [ "$STATUS" -ne 0 ]; then
