name: Build Halaqati Native v2.45.0 - 3 Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Halaqati_Native_Kotlin_v2_45_0.zip'
      - '.github/workflows/build-halaqati-native-v2.45.0.yml'

permissions:
  contents: read

concurrency:
  group: halaqati-native-v2-45-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '2.45.0'
  APP_VERSION_CODE: '24500'
  SOURCE_ZIP: 'Halaqati_Native_Kotlin_v2_45_0.zip'
  PROJECT_DIR: 'Halaqati_Native_Kotlin_v2.45.0'

jobs:
  build-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          unzip -t "$SOURCE_ZIP" >/dev/null
          rm -rf "$PROJECT_DIR"
          unzip -q "$SOURCE_ZIP"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/migration/source-contract.json"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore Firebase google-services.json
        shell: bash
        env:
          FIREBASE_JSON: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_JSON_B64: ${{ secrets.HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p app
          if [ -n "${FIREBASE_JSON:-}" ]; then
            printf '%s' "$FIREBASE_JSON" > app/google-services.json
          elif [ -n "${FIREBASE_JSON_B64:-}" ]; then
            printf '%s' "$FIREBASE_JSON_B64" | base64 -d > app/google-services.json
          else
            echo 'Missing HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON or HALAQATI_FIREBASE_GOOGLE_SERVICES_JSON_BASE64' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          p='app/google-services.json'
          d=json.load(open(p))
          clients=d.get('client',[])
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in clients]
          assert 'com.mohammedsamir.halaqati' in packages, packages
          print('Firebase package verified')
          PY

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HALAQATI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64:-}"
          cd "$PROJECT_DIR"
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.keystore
          test -s release.keystore

      - name: Static migration checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python scripts/static-parity-check.py
          ! grep -R --include='*.kt' -nE 'android\.webkit\.WebView|Capacitor' app/src/main/java
          grep -q 'applicationId = "com.mohammedsamir.halaqati"' app/build.gradle.kts
          grep -q 'versionCode = 24500' app/build.gradle.kts

      - name: Unit tests and release build
        shell: bash
        env:
          HALAQATI_STORE_PASSWORD: ${{ secrets.HALAQATI_STORE_PASSWORD }}
          HALAQATI_KEY_ALIAS: ${{ secrets.HALAQATI_KEY_ALIAS }}
          HALAQATI_KEY_PASSWORD: ${{ secrets.HALAQATI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -n "$HALAQATI_STORE_PASSWORD"
          test -n "$HALAQATI_KEY_ALIAS"
          test -n "$HALAQATI_KEY_PASSWORD"
          gradle --no-daemon --stacktrace \
            -PHALAQATI_KEYSTORE_PATH="$PWD/release.keystore" \
            -PHALAQATI_STORE_PASSWORD="$HALAQATI_STORE_PASSWORD" \
            -PHALAQATI_KEY_ALIAS="$HALAQATI_KEY_ALIAS" \
            -PHALAQATI_KEY_PASSWORD="$HALAQATI_KEY_PASSWORD" \
            testDebugUnitTest assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.mohammedsamir.halaqati' versionCode='24500' versionName='2.45.0'" apk-badging.txt
          mkdir -p artifacts
          cp "$APK" artifacts/Halaqati-Native-v2.45.0-signed.apk
          sha256sum artifacts/Halaqati-Native-v2.45.0-signed.apk | tee artifacts/SHA256SUMS.txt

      - name: Build update publish package
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python scripts/make-update-publish.py
          test -s update-publish/Halaqati-latest.apk
          test -s update-publish/version.json

      - name: Create migration audit bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p migration-audit
          cp migration/parity-matrix.md migration/source-contract.json apk-badging.txt migration-audit/
          cp artifacts/SHA256SUMS.txt migration-audit/
          printf '%s\n' "Native runtime: Kotlin + Jetpack Compose" "No WebView/Capacitor runtime" "Supabase project: xlxzwucqdtggkfwwqibk" > migration-audit/build-summary.txt

      - name: Artifact 1 - Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-Native-v2.45.0-Signed-APK
          path: ${{ env.PROJECT_DIR }}/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Artifact 2 - Update Publish
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-Native-v2.45.0-Update-Publish
          path: ${{ env.PROJECT_DIR }}/update-publish/
          if-no-files-found: error
          retention-days: 30

      - name: Artifact 3 - Migration Audit
        uses: actions/upload-artifact@v4
        with:
          name: Halaqati-Native-v2.45.0-Migration-Audit
          path: ${{ env.PROJECT_DIR }}/migration-audit/
          if-no-files-found: error
          retention-days: 30
